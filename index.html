<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mekanik Tesisat Hesap Aracı</title>
<style>
/* ============================================================
   Tasarım sistemi — koyu tema öncelikli, hesap yoğunluğu korunmuş
   ============================================================ */
:root{
  --bg:#f7f8fa; --bg-2:#eef0f4;
  --panel:#ffffff; --panel-2:#f4f6f9;
  --ink:#0d1117; --ink-2:#31383f; --muted:#697585;
  --line:#e3e7ee; --line-2:#d2d8e2;
  --accent:#4a57c9; --accent-2:#6f7ce8; --accent-soft:#eceefb; --accent-glow:74,87,201;
  --on-accent:#ffffff;
  --ok:#12855c; --ok-soft:#e8f6ef;
  --warn:#a8620f; --warn-soft:#fdf4e7;
  --res:#f8fafc;
  --grid:rgba(13,17,23,.045);
  --wash:rgba(74,87,201,.10);
  --spot:rgba(13,17,23,.045);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 16px -6px rgba(16,24,40,.10);
  --shadow-lg:0 2px 4px rgba(16,24,40,.04), 0 12px 32px -10px rgba(16,24,40,.16);
  --r:11px; --r-sm:8px;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){
:root{
  --bg:#08090b; --bg-2:#0b0d10;
  --panel:#101214; --panel-2:#16181c;
  --ink:#e8eaed; --ink-2:#c3c8cf; --muted:#858c98;
  --line:#1e2126; --line-2:#2a2e35;
  --accent:#8b93f8; --accent-2:#a7adfb; --accent-soft:#171a2e; --accent-glow:139,147,248;
  --on-accent:#0a0b0e;
  --ok:#4cc38a; --ok-soft:#0f2019;
  --warn:#e0a45f; --warn-soft:#241c11;
  --res:#131519;
  --grid:rgba(255,255,255,.035);
  --wash:rgba(139,147,248,.16);
  --spot:rgba(255,255,255,.055);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 18px -8px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.45), 0 16px 40px -12px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:13.5px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,
    "Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  letter-spacing:-.005em;
}
/* zemin: ışık yıkaması + ince ızgara */
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none}
body::before{z-index:-2;background:
  radial-gradient(62% 44% at 50% -12%, var(--wash), transparent 68%),
  radial-gradient(38% 30% at 96% -4%, rgba(var(--accent-glow),.07), transparent 70%)}
body::after{z-index:-1;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(78% 55% at 50% 0%,#000,transparent 76%);
  mask-image:radial-gradient(78% 55% at 50% 0%,#000,transparent 76%)}

/* ---------------- başlık ---------------- */
#topbar{position:sticky;top:0;z-index:30}
header{
  position:relative;padding:8px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);
  border-bottom:1px solid var(--line);
}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent) no-repeat;
  background-size:34% 100%;opacity:.85;animation:sweep 8s var(--ease) infinite}
@keyframes sweep{0%{background-position:-40% 0}55%,100%{background-position:150% 0}}
header h1{font-size:14.5px;margin:0;font-weight:640;letter-spacing:-.02em}
header .sub{font-size:10.5px;color:var(--muted);letter-spacing:.01em;margin-top:1px}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button.tool{
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);border-radius:var(--r-sm);
  padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;
  transition:border-color .18s,color .18s,background .18s,transform .12s}
button.tool:hover{border-color:var(--line-2);color:var(--ink);transform:translateY(-1px)}
button.tool:active{transform:none}
button.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ---------------- gezinme ---------------- */
nav{position:relative;padding:5px 12px 6px;
  background:color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  border-bottom:1px solid var(--line)}
nav .grp,nav .mods{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav .grp::-webkit-scrollbar,nav .mods::-webkit-scrollbar{display:none}
nav .grp{border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:5px}
nav button{white-space:nowrap;background:transparent;border:1px solid transparent;color:var(--muted);
  padding:4px 11px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:inherit;
  transition:color .16s,background .16s,border-color .16s}
nav button:hover{color:var(--ink);background:var(--panel-2)}
nav button.on{color:var(--ink);background:var(--panel-2);border-color:var(--line-2)}
nav .grp button{font-weight:600;font-size:12px;padding:4px 11px}
nav .grp button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);
  box-shadow:0 2px 10px -3px rgba(var(--accent-glow),.6)}
nav .mods button.on{color:var(--accent);background:var(--accent-soft);border-color:transparent;font-weight:600}

/* ---------------- yerleşim ---------------- */
main{max-width:1460px;margin:0 auto;padding:16px 14px 60px}
section{display:none}
section.on{display:block}
h2{font-size:19px;margin:0 0 2px;font-weight:640;letter-spacing:-.025em}
.lead{color:var(--muted);font-size:12.5px;margin:0 0 13px;max-width:80ch}

/* ---------------- kartlar ---------------- */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);
  transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow-lg)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  opacity:0;transition:opacity .3s;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),var(--spot),transparent 62%)}
.card:hover::before{opacity:1}
.card > *{position:relative;z-index:1}
.card h3{margin:0 0 10px;font-size:11.5px;font-weight:650;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;cursor:pointer;display:flex;align-items:center;gap:7px;
  user-select:none;transition:color .16s}
.card h3:hover{color:var(--accent)}
.card h3::before{content:"";width:5px;height:5px;border-radius:1px;background:var(--accent);
  transition:transform .2s var(--ease);flex:none}
.card.kapali h3::before{transform:rotate(45deg) scale(.85);background:var(--muted)}
.card.kapali h3{margin-bottom:0}
.card.kapali .cardbody{display:none}

/* ---------------- form ---------------- */
.grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
input,select{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--panel-2);color:var(--ink);font-size:13px;font-family:inherit;
  transition:border-color .16s,box-shadow .16s,background .16s;font-variant-numeric:tabular-nums}
input:hover,select:hover{border-color:var(--line-2)}
input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--panel);
  box-shadow:0 0 0 3px rgba(var(--accent-glow),.16)}
input[readonly]{background:var(--res);color:var(--muted)}

/* ---------------- sonuç kutuları ---------------- */
.res{background:var(--res);border:1px solid var(--line);border-radius:var(--r);padding:9px}
.out{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(126px,1fr))}
.o{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:7px 9px;transition:border-color .18s,transform .18s var(--ease)}
.o:hover{border-color:var(--line-2);transform:translateY(-1px)}
.o .k{font-size:10.5px;color:var(--muted);margin-bottom:2px;line-height:1.3;letter-spacing:.01em}
.o .v{font-size:16px;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;line-height:1.25}
.o .u{font-size:10.5px;color:var(--muted);font-weight:400;margin-left:2px;letter-spacing:0}
.o.hi{background:linear-gradient(160deg,var(--accent-soft),var(--panel) 70%);border-color:var(--accent)}
.o.hi .v{color:var(--accent)}
.o.hi::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  overflow:hidden;
  background:linear-gradient(115deg,transparent 20%,rgba(var(--accent-glow),.13) 50%,transparent 80%)
    no-repeat;background-size:55% 100%;animation:sweep 9s var(--ease) infinite}

/* ---------------- tablolar ---------------- */
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-sm)}
.wrap::-webkit-scrollbar{height:8px}
.wrap::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:4px 7px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  white-space:nowrap;line-height:1.25;padding-top:2px;padding-bottom:5px}
tbody tr{transition:background .14s}
tbody tr:hover{background:var(--panel-2)}
tfoot td{font-weight:650;border-top:1px solid var(--line-2);border-bottom:none;padding-top:6px}
td input,td select{padding:3px 6px;font-size:12.5px;min-width:56px;max-width:120px;border-radius:6px}
td input[type=number]{max-width:84px}

/* ---------------- notlar ---------------- */
.note{font-size:11.5px;color:var(--muted);background:var(--res);border:1px solid var(--line);
  border-left:2px solid var(--line-2);padding:6px 10px;border-radius:0 var(--r-sm) var(--r-sm) 0;
  margin-top:9px;line-height:1.5;transition:border-left-color .18s}
.note:not(.w){cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note:not(.w):hover{border-left-color:var(--accent)}
.note:not(.w) br{display:none}
.note:not(.w).acik,body.notlar-acik .note:not(.w){white-space:normal;text-overflow:clip}
.note:not(.w).acik br,body.notlar-acik .note:not(.w) br{display:block}
.note.w{background:var(--warn-soft);border-color:var(--warn);border-left-color:var(--warn);color:var(--ink-2)}
.note b{color:var(--warn)}
.note:not(.w) b{color:var(--ink-2)}

/* ---------------- diğer ---------------- */
.row2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.01em}
a{color:var(--accent)}
::selection{background:rgba(var(--accent-glow),.3);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* ---------------- animasyonlar ---------------- */
@keyframes panelIn{
  from{opacity:0;transform:translateY(12px) scale(.994);filter:blur(2px)}
  to{opacity:1;transform:none;filter:none}}
@keyframes titleIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
section.on > h2{animation:titleIn .38s var(--ease) both}
section.on > .lead{animation:titleIn .38s var(--ease) both;animation-delay:50ms}
section.on .card{animation:panelIn .46s var(--ease) both;
  animation-delay:calc(90ms + var(--i,0) * 55ms)}
section.on > h2::after{content:"";display:block;height:1px;width:180px;margin:9px 0 2px;
  background:linear-gradient(90deg,var(--accent),transparent);transform-origin:left;
  animation:lineGrow .75s var(--ease) both;animation-delay:70ms;opacity:.65}
/* açılış ışık süpürmesi */
#loadbeam{position:fixed;inset:0;z-index:200;pointer-events:none;
  background:linear-gradient(104deg,transparent 38%,rgba(var(--accent-glow),.10) 47%,
    rgba(255,255,255,.07) 50%,rgba(var(--accent-glow),.10) 53%,transparent 62%);
  animation:loadsweep 1.15s cubic-bezier(.32,0,.24,1) 1.85s both}
@keyframes loadsweep{from{transform:translate3d(-115%,0,0)}to{transform:translate3d(115%,0,0)}}


/* ---------------- açılış: ışık üçgeni ---------------- */
#splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;pointer-events:none;
  background:radial-gradient(64% 50% at 50% 45%, #121418 0%, #0a0b0e 42%, #050506 78%, #030304 100%);
  animation:splashOut .6s var(--ease) 1.78s both}
/* gradyan bantlanmasını kıran ince gren */
#splash::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.045;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
#splash .tri{position:relative;width:0;height:0;--u:50px;--v:43px;--d:26px;
  animation:triIn 1.2s var(--ease) both, triOut .6s var(--ease) 1.78s both}
/* üçgenin ortak ortam ışığı — yumuşak, tek katman */
#splash .tri::before{content:"";position:absolute;left:50%;top:calc(-1.5 * var(--v));
  width:calc(var(--u) * 7);height:calc(var(--v) * 7);transform:translate(-50%,-22%);
  border-radius:50%;background:#fff;filter:blur(62px);opacity:.032;
  animation:ambIn 1.4s var(--ease) both;animation-delay:.25s}
#splash i{position:absolute;width:var(--d);height:var(--d);border-radius:50%;background:#fff;
  left:calc(var(--x) * var(--u) - var(--d)/2);
  top:calc((var(--y) - 1.5) * var(--v) - var(--d)/2);
  opacity:0;transform:scale(.35);will-change:transform,opacity,filter;
  animation:dotIn .48s var(--ease) both,
            dotGlow 2.4s ease-in-out infinite,
            edgeRun .46s ease-out forwards;
  animation-delay:calc(var(--i) * 38ms),
                  calc(460ms + var(--i) * 38ms),
                  calc(880ms + var(--p) * 50ms)}
/* bloom: bulanıklaştırılmış dolu daireler → gerçek Gauss düşüşü, bant yok */
#splash i::before,#splash i::after{content:"";position:absolute;left:50%;top:50%;border-radius:50%;
  background:#fff;transform:translate(-50%,-50%);pointer-events:none}
#splash i::before{width:205%;height:205%;filter:blur(6px);opacity:.30}
#splash i::after{width:470%;height:470%;filter:blur(21px);opacity:.062}
@keyframes dotIn{to{opacity:1;transform:none}}
@keyframes dotGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.38)}}
@keyframes ambIn{from{opacity:0}to{opacity:.032}}
/* kenarları tek tek dolaşan ışık */
@keyframes edgeRun{
  0%{transform:scale(1);filter:brightness(1)}
  30%{transform:scale(1.72);filter:brightness(2.6) drop-shadow(0 0 26px rgba(255,255,255,.95))}
  100%{transform:scale(1);filter:brightness(1)}}
@keyframes triIn{from{transform:scale(.88)}to{transform:scale(1)}}
@keyframes triOut{to{transform:scale(1.3);opacity:0;filter:blur(7px)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
/* başlıktaki küçük ışık işareti */
.mark{position:relative;width:22px;height:20px;flex:none;margin-right:2px}
.mark i{position:absolute;width:3.6px;height:3.6px;border-radius:50%;background:var(--accent);
  left:calc(11px + var(--x) * 5px - 1.8px); top:calc(10px + (var(--y) - 1.5) * 4.6px - 1.8px);
  animation:markGlow 3.4s ease-in-out infinite;animation-delay:calc(var(--i) * 90ms)}
.mark i::after{content:"";position:absolute;left:50%;top:50%;width:320%;height:320%;border-radius:50%;
  transform:translate(-50%,-50%);background:var(--accent);filter:blur(3px);opacity:.45}
@keyframes markGlow{0%,100%{opacity:.5}50%{opacity:1}}
@media (max-width:640px){
  #splash .tri{--u:40px;--v:34px;--d:21px}
  #splash i::after{filter:blur(17px)}
  header{padding:6px 11px;flex-wrap:nowrap}
  .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tools::-webkit-scrollbar{display:none}
  header .sub{display:none}
  header h1{font-size:13.5px}
  .tools{gap:5px}
  button.tool{padding:4px 9px;font-size:11.5px}
  main{padding:12px 10px 50px}
  h2{font-size:17px}
  .lead{font-size:12px;margin-bottom:11px}
  .card{padding:11px 11px}
  section.on > h2::after{width:110px}
}
@media (prefers-reduced-motion:reduce){
  #splash{display:none}
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
@media print{
  header,nav,.tools,#loadbeam,#splash{display:none}
  body::before,body::after{display:none}
  section{display:block!important;page-break-after:always}
  section.on > h2,section.on > .lead,section.on .card{animation:none!important}
  section.on > h2::after{display:none}
  body{background:#fff}
  .card,.res{box-shadow:none;border-color:#ccc}
  .card::before,.o.hi::after{display:none}
  .card.kapali .cardbody{display:block!important}
  .card h3::before{display:none}
  .note:not(.w){white-space:normal!important;overflow:visible!important;text-overflow:clip!important}
  .note:not(.w) br{display:block!important}
}
</style>

</head>
<body>
<div id="splash"><div class="tri"><i style="--x:0;--y:0;--i:0;--p:0"></i><i style="--x:-0.5;--y:1;--i:1;--p:8"></i><i style="--x:0.5;--y:1;--i:2;--p:1"></i><i style="--x:-1;--y:2;--i:3;--p:7"></i><i style="--x:0;--y:2;--i:4;--p:40"></i><i style="--x:1;--y:2;--i:5;--p:2"></i><i style="--x:-1.5;--y:3;--i:6;--p:6"></i><i style="--x:-0.5;--y:3;--i:7;--p:5"></i><i style="--x:0.5;--y:3;--i:8;--p:4"></i><i style="--x:1.5;--y:3;--i:9;--p:3"></i></div></div>
<div id="topbar"><header>
  <div class="mark"><i style="--x:0;--y:0;--i:0;--p:0"></i><i style="--x:-0.5;--y:1;--i:1;--p:8"></i><i style="--x:0.5;--y:1;--i:2;--p:1"></i><i style="--x:-1;--y:2;--i:3;--p:7"></i><i style="--x:0;--y:2;--i:4;--p:40"></i><i style="--x:1;--y:2;--i:5;--p:2"></i><i style="--x:-1.5;--y:3;--i:6;--p:6"></i><i style="--x:-0.5;--y:3;--i:7;--p:5"></i><i style="--x:0.5;--y:3;--i:8;--p:4"></i><i style="--x:1.5;--y:3;--i:9;--p:3"></i></div>
  <div>
    <h1>Mekanik Tesisat Hesap Aracı</h1>
    <div class="sub">56 modül · Isıtma · Boru · Yerden ısıtma · Havalandırma · Yangın &amp; fan · Su · Havuz · Altyapı · Doğalgaz · Tedarikçi rehberi</div>
  </div>
  <div class="tools">
    <button class="tool" onclick="saveJSON()">Kaydet (.json)</button>
    <button class="tool" onclick="document.getElementById('fileIn').click()">Yükle</button>
    <button class="tool" id="btnNot" onclick="notlarToggle()">Notlar</button>
    <button class="tool" onclick="kartlarToggle()">Kartları aç/kapat</button>
    <button class="tool" onclick="window.print()">Yazdır / PDF</button>
    <input type="file" id="fileIn" accept=".json" style="display:none" onchange="loadJSON(this)">
  </div>
</header>
<div id="loadbeam"></div>
<nav id="nav"></nav></div>
<main id="main"></main>
<script>
/* ============================ VERİ TABLOLARI ============================ */
const BORU = {

function fmt(n,d){ if(n===null||n===undefined||!isFinite(n)) return "—";
  d = (d===undefined) ? (Math.abs(n)>=100?1:(Math.abs(n)>=10?2:3)) : d;
  return n.toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function put(id,val,dec){ const e=$(id); if(e) e.innerHTML = (typeof val==='string')?val:fmt(val,dec); }
const KCAL = 860;                       // 1 kW = 860 kcal/h
const up = x => (x>0 ? Math.ceil(x - 1e-9) : 0);
/* Excel ile birebir: iç çap [mm] = ( 4·Q / (3,14·3600·v) )^0,5 · 1000 ;  Q [m³/h], v [m/s] */
function capMM(q_m3h, v){ if(!(q_m3h>0)||!(v>0)) return 0; return Math.pow((4*q_m3h)/(3.14*3600*v),0.5)*1000; }
function debiM3H(ic_mm, v){ return (Math.pow(ic_mm/1000,2)*3.14*v*3600)/4; }
function seçBoru(mat, d_req){
  const t = BORU[mat]; if(!t||!(d_req>0)) return "—";
  for(const r of t.rows){ if(r[t.ic] >= d_req) return String(r[t.ad_i]) + (mat==='celik'?" ("+r[1]+" mm)":" mm"); }
  return "tablo dışı (> "+t.rows[t.rows.length-1][t.ic]+" mm)";
}
function inter(x, xs, ys){ if(x<=xs[0]) return ys[0];
  for(let i=1;i<xs.length;i++){ if(x<=xs[i]){ const t=(x-xs[i-1])/(xs[i]-xs[i-1]); return ys[i-1]+t*(ys[i]-ys[i-1]); } }
  return ys[ys.length-1]; }
function opt(arr,sel){ return arr.map(o=>`<option${o===sel?' selected':''}>${o}</option>`).join(''); }
function F(id,label,val,unit,step){ return `<div><label for="${id}">${label}${unit?' <span style="opacity:.7">('+unit+')</span>':''}</label>
  <input id="${id}" type="number" step="${step||'any'}" value="${val}" oninput="calcAll()"></div>`; }
function SEL(id,label,arr,val){ return `<div><label for="${id}">${label}</label>
  <select id="${id}" onchange="calcAll()">${opt(arr,val)}</select></div>`; }
function O(id,label,unit,hi){ return `<div class="o${hi?' hi':''}"><div class="k">${label}</div>
  <div class="v"><span id="${id}">—</span>${unit?'<span class="u">'+unit+'</span>':''}</div></div>`; }

 html:(function(){

      <td id="kz_deb${i}">—</td><td id="kz_kw${i}">—</td><td id="kz_cap${i}">—</td><td id="kz_sec${i}">—</td></tr>`; }
   return `<div class="card"><h3>Zonlar</h3><div class="wrap"><table>
     <thead><tr><th>Zon</th><th>Kapasite<br>kcal/h</th><th>ΔT<br>°C</th><th>Hız<br>m/s</th>

     ${O('kz_kdeb','Kollektör debisi','m³/h')}
     ${O('kz_kcap','Kollektör iç çapı','mm',1)}

 })(),

   let tq=0,tdeb=0;

     const kul = S('kz_ad'+i)!=="kullanılmıyor";

     const deb = dt>0? q/(dt*1000) : 0;
     const cap = capMM(deb,v);
     put('kz_deb'+i,deb,2); put('kz_kw'+i,q/KCAL,1); put('kz_cap'+i,cap,1);
     put('kz_sec'+i, deb>0?seçBoru('celik',cap):"—");
     tq+=q; tdeb+=deb;

 }});

/* ---------------------------------------------------------------- 2) BORU ÇAPI */
MOD.push({grup:"Boru", id:"boru", ad:"Boru Çapı", baslik:"Boru Çapı Hesabı",

 html:`<div class="card"><h3>Giriş</h3><div class="grid">

   ${F('br_deger','Değer','17500')}

   ${O('bh_ltm','Birim hacim','lt/m')} ${O('bh_top','Toplam su hacmi','litre',1)}
 </div></div></div>`,
 calc:function(){
   const m=S('br_mod'), x=V('br_deger'), dt=V('br_dt'), v=V('br_v');
   let kcal=0,lth=0,m3h=0,cap=0;
   if(m.startsWith("Kapasite (kcal")){ kcal=x; lth=dt>0?x/dt:0; m3h=lth/1000; cap=capMM(m3h,v); }
   else if(m.startsWith("Kapasite (kW")){ kcal=x*KCAL; lth=dt>0?kcal/dt:0; m3h=lth/1000; cap=capMM(m3h,v); }
   else if(m.startsWith("Debi (lt/h")){ lth=x; m3h=x/1000; kcal=x*dt; cap=capMM(m3h,v); }
   else if(m.startsWith("Debi (m³/h")){ m3h=x; lth=x*1000; kcal=lth*dt; cap=capMM(m3h,v); }
   else { cap=x; m3h=debiM3H(x,v); lth=m3h*1000; kcal=lth*dt; }
   put('br_kcal',kcal,0); put('br_kw',kcal/KCAL,2); put('br_lth',lth,0);
   put('br_m3h',m3h,3); put('br_lts',m3h/3.6,3); put('br_cap',cap,1);
   const key = Object.keys(BORU).find(k=>BORU[k].ad===S('br_mat')) || 'celik';
   put('br_sec', cap>0?seçBoru(key,cap):"—");
   const d=V('bh_ic'), L=V('bh_uz'); const ltm=Math.pow(d/1000/2,2)*3.14*1000;
   put('bh_ltm',ltm,3); put('bh_top',ltm*L,2);
 }});

  <div class="row2">

   </div><div class="res" style="margin-top:12px"><div class="out">

     ${O('ys_su','Su','lt')} ${O('ys_katki','Şap katkısı','lt')} ${O('ys_straf','Strafor','paket')}
   </div><div class="note">1 m³ beton için: 1500 kg kum · 300 kg çimento · 108 lt su · 3 lt katkı.
   Strafor: 1 paket = 6,864 m².</div></div></div>
  </div>

  <div class="card"><h3>Kolektör Tipleri</h3><div class="wrap"><table>

   </table></div><div class="note">12'li kolektöre kadar kombilerde hidrolik karıştırıcıya gerek yoktur.</div></div>`;
 })(),
 calc:function(){
   const wm2 = YZI_BOLGE[S('yz_bolge')]||90;
   const cap = S('yz_cap');
   const wm  = cap==="17" ? wm2/6.67 : (wm2/6.67)*0.9452;
   const ltm = cap==="16" ? 0.113 : 0.133;
   const maxm= V('yz_max');
   put('yz_wm2',wm2,0); put('yz_wm',wm,2);
   let tm2=0,tmet=0,tagz=0,tkol=0,tkcal=0,tlt=0;
   for(let i=0;i<7;i++){
     const m2=V('yz_m2'+i), mod=parseFloat(S('yz_mod'+i));
     const met = mod>0? m2/(mod/100) : 0;
     const agz = maxm>0? up(met/maxm) : 0;
     const agizSay = V('yz_kagz'+i);
     const kol = agizSay>0? up(agz/agizSay) : 0;
     const kcal= (met*wm)/1000*KCAL;
     const lt  = ltm*met;
     put('yz_met'+i,met,1); put('yz_agz'+i,agz,0); put('yz_kol'+i,kol,0);
     put('yz_kcal'+i,kcal,0); put('yz_kw'+i,kcal/KCAL,2); put('yz_lt'+i,lt,1);
     tm2+=m2; tmet+=met; tagz+=agz; tkol+=kol; tkcal+=kcal; tlt+=lt;
   }
   put('yz_tm2',tm2,1); put('yz_tmet',tmet,1); put('yz_tagz',tagz,0); put('yz_tkol',tkol,0);
   put('yz_tkcal',tkcal,0); put('yz_tkw',tkcal/KCAL,2); put('yz_tlt',tlt,1);
   const ht=V('yh_agiz')*V('yh_met'); const hkw=(ht*wm)/1000;
   put('yh_top',ht,0); put('yh_kcal',hkw*KCAL,0); put('yh_kw',hkw,2);
   const beton=V('ys_alan')*(V('ys_kal')/100);
   put('ys_beton',beton,2); put('ys_kum',beton*1500,0); put('ys_cim',beton*300,0);
   put('ys_su',beton*108,0); put('ys_katki',beton*3,1); put('ys_straf',V('ys_alan')/6.864,1);
 }});

 </div>`,

   const kcal = hac*kat, w = kcal*1.163;
   put('rd_hac',hac,1); put('rd_kat_k',kat,0); put('rd_kcal',kcal,0);
   put('rd_w',w,0); put('rd_wm2',V('rd_m2')>0?w/V('rd_m2'):0,1); put('rd_met',kcal/1509,2);

MOD.push({grup:"Isıtma", id:"genlesme", ad:"Pompa & Genleşme Tankı", baslik:"Sirkülasyon Pompası ve Genleşme Tankı Seçimi",
 lead:"Kazan kapasitesi, ısıtma tipi ve bina ölçülerinden pompa debisi, basma yüksekliği ve kapalı genleşme tankı hacmi.",
 html:`<div class="card"><h3>Giriş</h3><div class="grid">
   ${F('gt_kw','Kazan kapasitesi','60','kW')}
   ${SEL('gt_tip','Isıtma tipi',Object.keys(ISITMA_TIPI),"YERDEN ISITMA")}

 <div class="res" style="margin-top:14px"><div class="out">

   ${O('gt_ltkw','Tesisat su hacmi katsayısı','lt/kW')}
   ${O('gt_vsu','Tesisat su hacmi','litre')}

   ${O('gt_vsog','Sistem soğukken ilave','litre')}
   ${O('gt_pstat','Statik basınç','bar')}
   ${O('gt_pacma','Emniyet ventili açma basıncı','bar')}
   ${O('gt_pemn','Emniyet basıncı','bar')}
   ${O('gt_tank','Kapalı genleşme tankı hacmi','litre',1)}
   ${O('gt_debi','Pompa debisi','m³/h',1)}
   ${O('gt_bas','Pompa basma yüksekliği','mSS',1)}
   ${O('gt_bas2','Alternatif (kazan dairesi kabulü)','mSS')}
 </div></div>
 <div class="note">Tank hacmi = (Vgenleşen + Vsoğuk) · (Pemniyet + 1) ⁄ (Pemniyet − Pstatik).
 Pompa debisi: yerden ısıtmada kcal/h ⁄ 10000, radyatörlü sistemde kcal/h ⁄ 20000.
 Basma yüksekliği: yerden ısıtma (en+boy+yükseklik)·0,09 · radyatör (en+boy+yükseklik)·0,04.
 3–4 katlı binalarda maks. 3–4 mSS · 10 kata kadar 4–5 mSS · 10 kattan yüksekte 6 mSS ve üzeri.</div></div>

 <div class="card"><h3>Yerden Isıtma Metrajına Göre Kapasite</h3><div class="grid">
   ${F('gm_met','Yerden ısıtma boru metrajı','3000','m')}
   ${F('gm_w','1 m borunun verdiği ısı','12.5','W')}
 </div><div class="res" style="margin-top:12px"><div class="out">
   ${O('gm_kw','Hesaplanan kapasite','kW',1)} ${O('gm_kcal','Hesaplanan kapasite','kcal/h')}
 </div></div></div>`,
 calc:function(){
   const kw=V('gt_kw'), kcal=kw*KCAL, tip=S('gt_tip'), ltkw=ISITMA_TIPI[tip]||0;
   const yuk=V('gt_yuk'), toplam=V('gt_en')+V('gt_boy')+yuk;
   const vsu=kw*ltkw, vgen=vsu*3.55/100, vsog=vsu*0.005, pstat=yuk/10;
   const pacma = yuk<15?2.5:(yuk<25?3.5:(yuk<35?4.5:(yuk<45?5.5:null)));
   const pemn = pacma!==null? pacma-0.5 : null;
   put('gt_kcal',kcal,0); put('gt_ltkw',ltkw,1); put('gt_vsu',vsu,1);
   put('gt_vgen',vgen,2); put('gt_vsog',vsog,2); put('gt_pstat',pstat,2);
   put('gt_pacma', pacma===null?"KONTROL ET":fmt(pacma,1));
   put('gt_pemn',  pemn===null?"KONTROL ET":fmt(pemn,1));
   put('gt_tank', (pemn!==null && (pemn-pstat)>0) ? fmt((vgen+vsog)*(pemn+1)/(pemn-pstat),1)
                  : "KONTROL ET");
   put('gt_debi', tip==="YERDEN ISITMA" ? kcal/10000 : kcal/20000, 2);
   put('gt_bas', toplam*(tip==="YERDEN ISITMA"?0.09:0.04),2);
   put('gt_bas2', toplam*0.03,2);
   const gkw=(V('gm_met')*V('gm_w'))/1000;
   put('gm_kw',gkw,2); put('gm_kcal',gkw*KCAL,0);
 }});

 <div class="res" style="margin-top:14px"><div class="out">
   ${O('dk_akis','Su debisi','kg/s')}
   ${O('dk_m3h','Su debisi','m³/h')}

   ${O('dk_capd','Denge kabı çapı','mm',1)}
   ${O('dk_boy','Denge kabı boyu','cm',1)}
   ${O('dk_primer','Primer (kazan) aks ölçüsü','cm')}
   ${O('dk_sek','Sekonder (tesisat) aks ölçüsü','cm')}
   ${O('dk_geo','Geometrik kontrol çapı','mm')}
 </div></div>
 <div class="note w"><b>Kontrol notu:</b> Orijinal tabloda bağlantı çapı
 √(kesit ⁄ 0,785) ⁄ hız bağıntısıyla bulunuyor; hız bir kez kesitte, bir kez de burada kullanıldığı için
 sonuç hız katsayısı kadar büyük çıkar. Karşılaştırma için saf geometrik çap
 (√(kesit ⁄ 0,785)) da yukarıda ayrıca verilmiştir. Tabloyla birebir aynı sonuç için üstteki değeri kullanın.</div></div>`,
 calc:function(){
   const kw=V('dk_kw'), dt=V('dk_dt'), v=V('dk_v'), c=V('dk_c');
   const akis = (dt*c)>0 ? kw/(dt*c) : 0;
   const kesit = v>0 ? (akis*1000)/v : 0;
   const kolcap = v>0 ? Math.sqrt(kesit/0.785)/v : 0;
   const geo = Math.sqrt(kesit/0.785);
   const capd = 2.25*kolcap;
   put('dk_akis',akis,3); put('dk_m3h',akis*3.6,2); put('dk_kesit',kesit,1);
   put('dk_kolcap',kolcap,1); put('dk_capd',capd,1);
   put('dk_boy',(5*capd)/10,1); put('dk_primer',(4*capd)/10,1); put('dk_sek',(3.5*capd)/10,1);
   put('dk_geo',geo,1);
 }});
</script>

 })(),

 }});

MOD.push({grup:"Su", id:"sihhi", ad:"Sıhhi Tesisat", baslik:"Sıhhi Tesisat Boru Çapı (Yük Birimi)",
 lead:"Cihaz adetlerinden toplam yük birimi ve buna karşılık gelen kolon çapları.",
 html:`<div class="row2">
  <div class="card"><h3>Soğuk Su</h3>${ybTablo('ss',YB_SOGUK)}
   <div class="res" style="margin-top:12px"><div class="out">
     ${O('ss_celik','Çelik / galvaniz kolon','',1)} ${O('ss_ppr','PP-R','')}

 </div>
 <div class="card"><h3>Pis Su</h3>${ybTablo('ps',YB_PIS)}

  </table></div></div>`,
 calc:function(){
   function hesapla(pre,liste){ let t=0;
     liste.forEach((c,i)=>{ const x=V(pre+'_a'+i)*c[1]; t+=x; put(pre+'_t'+i,x,1); });
     put(pre+'_top',t,1); return t; }
   const s1=hesapla('ss',YB_SOGUK), s2=hesapla('sc',YB_SICAK), s3=hesapla('ps',YB_PIS);
   function cap(tbl,yb,idx){ if(yb<=0) return "—";
     for(const r of tbl){ if(yb<=r[0]) return r[idx]; } return "tablo dışı"; }
   put('ss_celik',cap(CAP_SOGUK,s1,1)); put('ss_ppr',cap(CAP_SOGUK,s1,2));
   put('ss_pe',cap(CAP_SOGUK,s1,3));    put('ss_bakir',cap(CAP_SOGUK,s1,4));
   put('sc_celik',cap(CAP_SICAK,s2,1)); put('sc_ppr',cap(CAP_SICAK,s2,2));
   put('sc_pe',cap(CAP_SICAK,s2,3));    put('sc_bakir',cap(CAP_SICAK,s2,4));
   let dus="—",yat="—";

 html:(function(){

      <td><input id="kk_b${i}" type="number" step="any" value="${r[1]}" oninput="calcAll()"></td>
      <td><input id="kk_q${i}" type="number" step="any" value="${r[2]}" oninput="calcAll()"></td>
      <td><input id="kk_L${i}" type="number" step="any" value="${r[3]}" oninput="calcAll()"></td>
      <td><input id="kk_d${i}" type="number" step="1" value="${r[4]}" oninput="calcAll()"></td>
      <td><input id="kk_t${i}" type="number" step="1" value="${r[5]}" oninput="calcAll()"></td>
      <td><input id="kk_dm${i}" type="number" step="1" value="${r[6]}" oninput="calcAll()"></td>
      <td><input id="kk_g${i}" type="number" step="1" value="${r[7]}" oninput="calcAll()"></td>
      <td id="kk_dh${i}">—</td><td id="kk_v${i}">—</td><td id="kk_R${i}">—</td><td id="kk_top${i}">—</td></tr>`; }
   return `<div class="card"><h3>Genel</h3><div class="grid">
     ${F('kk_e','Yüzey pürüzlülüğü','0.15','mm')}
     ${F('kk_nu','Kinematik viskozite (×10⁻⁶)','17','m²/s')}
     ${F('kk_menfez','Menfez kaybı','50','Pa')}
   </div></div>
   <div class="card"><h3>Kanal Parçaları</h3><div class="wrap"><table>
    <thead><tr><th>#</th><th>a<br>mm</th><th>b<br>mm</th><th>Debi<br>m³/h</th><th>Şaft<br>uzunluğu m</th>
    <th>Dirsek</th><th>Te</th><th>Damper</th><th>Giriş/<br>çıkış</th>
    <th>Dh<br>mm</th><th>Hız<br>m/s</th><th>R<br>Pa/m</th><th>Kayıp<br>Pa</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="12">TOPLAM HESAPLANAN</td><td id="kk_toplam">—</td></tr>
    <tr><td colspan="12">MENFEZ DAHİL TASARIM KAYBI</td><td id="kk_dizayn">—</td></tr></tfoot>
   </table></div>
   <div class="note">Dh = 1,3·(a·b)^0,625 ⁄ (a+b)^0,25 · λ Swamee-Jain ile · R = 600·λ·v² ⁄ Dh ·
   Direnç katsayıları: dirsek 0,45 · te 0,70 · damper 0,60 · giriş/çıkış 0,50 · Pv = 0,6·v² (ρ = 1,2 kg/m³).</div></div>`;
 })(),
 calc:function(){
   const e=V('kk_e'), nu=V('kk_nu'); let toplam=0;
   for(let i=0;i<6;i++){
     const a=V('kk_a'+i), b=V('kk_b'+i), q=V('kk_q'+i), L=V('kk_L'+i);
     if(!(a>0&&b>0&&q>0)){ ['dh','v','R','top'].forEach(k=>put('kk_'+k+i,"—")); continue; }
     const dh = 1.3*Math.pow(a*b,0.625)/Math.pow(a+b,0.25);
     const ls = q/3.6;
     const vD = 1273.24*ls/(dh*dh);
     const re = vD*dh*1e6/(1e3*nu);
     const lam = 1.325/Math.pow(Math.log((e/3.7/dh)+(5.74/Math.pow(re,0.9))),2);
     const R = 600*lam*vD*vD/dh;
     const pv = 0.6*vD*vD;
     const zeta = V('kk_d'+i)*0.45+V('kk_t'+i)*0.70+V('kk_dm'+i)*0.60+V('kk_g'+i)*0.50;
     const kayip = R*L + zeta*pv;
     put('kk_dh'+i,dh,1); put('kk_v'+i,vD,2); put('kk_R'+i,R,3); put('kk_top'+i,kayip,2);
     toplam+=kayip;
   }
   put('kk_toplam',toplam,2); put('kk_dizayn',toplam+V('kk_menfez'),2);
 }});

   const ozel = ((1.24*hiz*hiz)/2)*zeta/10;
   const net = duz+ozel+V('dv_panjur')+V('dv_filtre');

   const t=V('na_t'), hac=V('na_u')*V('na_g')*V('na_y');

   put('na_su',su,3); put('na_kap', gun>0? su/gun : 0, 3);
 }});

const HAVUZ_KAYIP = {"Kapalı havuz":103.2,"Açık havuz":645,"Kısmen korunmuş kapalı havuz":240.8,
  "Kısmen korunmuş açık havuz":372.38};
const HAVUZ_TIPI = {"Ev":[0.25,10],"Villa":[0.5,12.5],"Tesis":[3,15]};

MOD.push({grup:"Havuz & Enerji", id:"havuz", ad:"Havuz Eşanjör", baslik:"Havuz Eşanjör ve Denge Deposu",
 lead:"Havuz ısıtma yükü (iki yöntem), eşanjör kapasitesi ve denge deposu hacmi.",
 html:`<div class="card"><h3>Yöntem 1 — Su Yüzeyi Kayıp Katsayısı</h3><div class="grid">
   ${F('hv_en','Havuz eni','3','m')} ${F('hv_boy','Havuz boyu','10','m')} ${F('hv_der','Derinlik','3','m')}
   ${F('hv_t1','İlk su sıcaklığı','24','°C')} ${F('hv_t2','İstenen su sıcaklığı','28','°C')}
 </div><div class="res" style="margin-top:12px"><div class="out">
   ${O('hv_yuz','Havuz su yüzeyi','m²')} ${O('hv_hac','Havuz hacmi','m³')}
   ${O('hv_ka','Açık havuz kaybı','kcal/h')} ${O('hv_kk','Kapalı havuz kaybı','kcal/h')}
 </div></div>
 <div class="wrap" style="margin-top:12px"><table>
  <thead><tr><th>Isınma süresi</th><th>Isınma yükü<br>kcal/h</th><th>Açık toplam<br>kcal/h</th>
  <th>Açık<br>kW</th><th>Kapalı toplam<br>kcal/h</th><th>Kapalı<br>kW</th></tr></thead>
  <tbody id="hv_tablo"></tbody></table></div>
 <div class="note">Isınma yükü = hacim · 1000 · ΔT ⁄ süre. Kayıp: açık havuz 375, kapalı havuz 104 kcal/h·m².</div></div>

 <div class="row2">
  <div class="card"><h3>Yöntem 2 — Yapısal Kayıp Katsayısı</h3><div class="grid">
    ${F('h2_y','Yükseklik','1.5','m')} ${F('h2_en','En','5.7','m')} ${F('h2_boy','Boy','4.1','m')}
    ${F('h2_sure','İlk ısınma süresi','12','saat')}
    ${F('h2_t1','İlk su sıcaklığı','24','°C')} ${F('h2_t2','İstenen sıcaklık','28','°C')}
    ${SEL('h2_tip','Havuz tipi',Object.keys(HAVUZ_KAYIP),"Kapalı havuz")}
  </div><div class="res" style="margin-top:12px"><div class="out">
    ${O('h2_hac','Havuz hacmi','m³')} ${O('h2_alan','Yapısal yüzey alanı','m²')}
    ${O('h2_ilk','Devreye alma yükü','kcal/h')} ${O('h2_ek','Ek ısı gücü','kcal/h')}
    ${O('h2_top','Toplam kapasite','kcal/h',1)} ${O('h2_kw','Toplam kapasite','kW',1)}
  </div></div><div class="note">Yüzey alanı, prizmanın altı yüzeyi toplanarak alınır (orijinal tablo ile birebir).</div></div>

  <div class="card"><h3>Denge Deposu</h3><div class="grid">
    ${F('hd_en','Havuz eni','10','m')} ${F('hd_boy','Havuz boyu','10.6','m')} ${F('hd_der','Derinlik','1.5','m')}
    ${SEL('hd_tip','Havuz tipi',Object.keys(HAVUZ_TIPI),"Tesis")}
    ${F('hd_kg','Taşma kanal genişliği','20','cm')}
    ${F('hd_yuk','Depo yüksekliği','3','m')} ${F('hd_gen','Depo genişliği','4','m')}
  </div><div class="res" style="margin-top:12px"><div class="out">
    ${O('hd_suh','Havuz su hacmi','m³')}
    ${O('hd_kanal','Taşma kanalı hacmi','m³')}
    ${O('hd_ek','Kullanıcı ek hacmi','m³')}
    ${O('hd_sist','Sistem denge hacmi','m³')}
    ${O('hd_top','Toplam denge deposu','m³',1)}
    ${O('hd_uz','Gerekli depo uzunluğu','m',1)}
  </div></div><div class="note">Kanal kesiti orijinal tabloda 0,30 × 0,20 m sabittir; girilen genişlik yalnızca
  çevre düzeltmesinde kullanılır. Ek hacim: Ev 0,25 · Villa 0,5 · Tesis 3 m³. Sistem payı: %10 / %12,5 / %15.</div></div>
 </div>`,
 calc:function(){
   const yuz=V('hv_en')*V('hv_boy'), hac=yuz*V('hv_der'), dt=V('hv_t2')-V('hv_t1');
   const ka=375*yuz, kk=104*yuz;
   put('hv_yuz',yuz,1); put('hv_hac',hac,1); put('hv_ka',ka,0); put('hv_kk',kk,0);
   $('hv_tablo').innerHTML=[12,24,48,72].map(sa=>{
     const isi = sa>0 ? (hac*1000*dt)/sa : 0;
     return `<tr><td>${sa} saat</td><td>${fmt(isi,0)}</td><td>${fmt(isi+ka,0)}</td>
       <td>${fmt((isi+ka)/KCAL,2)}</td><td>${fmt(isi+kk,0)}</td><td>${fmt((isi+kk)/KCAL,2)}</td></tr>`;
   }).join('');
   const y=V('h2_y'), e=V('h2_en'), b=V('h2_boy');
   const hac2=y*e*b, alan2=2*(y*e+y*b+e*b), su=V('h2_sure');
   const ilk = su>0 ? hac2*1000*(V('h2_t2')-V('h2_t1'))/su : 0;
   const ek=(HAVUZ_KAYIP[S('h2_tip')]||0)*alan2;
   put('h2_hac',hac2,3); put('h2_alan',alan2,2); put('h2_ilk',ilk,0); put('h2_ek',ek,0);
   put('h2_top',ilk+ek,0); put('h2_kw',(ilk+ek)/KCAL,2);
   const hen=V('hd_en'), hbo=V('hd_boy');
   const suh=hen*hbo*V('hd_der');
   const kanal=((hen*2+hbo*2)+(V('hd_kg')/100)*4)*0.3*0.2;
   const tp=HAVUZ_TIPI[S('hd_tip')]||[0,0];
   const sist=suh*tp[1]/100, topd=kanal+tp[0]+sist;
   const pay=V('hd_yuk')*V('hd_gen');
   put('hd_suh',suh,1); put('hd_kanal',kanal,2); put('hd_ek',tp[0],2);
   put('hd_sist',sist,2); put('hd_top',topd,2); put('hd_uz', pay>0? topd/pay : 0, 2);
 }});

   ${O('hn_wb','Birim buharlaşma','kg/m²h')}
   ${O('hn_wmax','Maksimum buharlaşma','kg/h',1)}
   ${O('hn_wmin','Minimum buharlaşma','kg/h')}
   ${O('hn_wort','Ortalama buharlaşma','kg/h',1)}
   ${O('hn_qmax','Maksimum hava debisi','m³/h',1)}
   ${O('hn_qort','Ortalama hava debisi','m³/h',1)}
   ${O('hn_hd','Hava değişimi','1/h')}
 </div></div>
 <div class="note">Antoine bağıntısı ile Ps ve Pd · X = 0,622·Pd ⁄ (1013 − Pd)·1000 ·
 w = 0,00541·(Ps − Pd)^1,2 · Debi = W·1000 ⁄ (X − 9) ⁄ 1,15.
 X değeri 9 g/kg altına düşerse hesap geçersizdir.</div></div>`,
 calc:function(){
   const tw=V('hn_tw'), tr=V('hn_tr'), rh=V('hn_rh');
   const ps=Math.exp(23.64074-4076.8/(236.665+tw))/100;
   const pd=Math.exp(23.64074-4076.8/(236.665+tr))*(rh/100)/100;
   const x=0.622*(pd/(1013-pd))*1000;
   const wb=0.00541*Math.pow(Math.max(ps-pd,0),1.2);
   const nfg=V('hn_nfg'), nfn=V('hn_nfn'), A=V('hn_alan'), sure=V('hn_sure');
   const wmax=wb*nfg*A, wmin= nfg>0 ? wmax*nfn/nfg : 0;
   const wort=(sure*wmax+wmin*(24-sure))/24;
   const payda=(x-9)*1.15;
   put('hn_ps',ps,3); put('hn_pd',pd,3); put('hn_x',x,3); put('hn_wb',wb,4);
   put('hn_wmax',wmax,2); put('hn_wmin',wmin,2); put('hn_wort',wort,2);
   put('hn_qmax', payda>0 ? wmax*1000/payda : "X ≤ 9 — geçersiz", payda>0?0:undefined);
   put('hn_qort', payda>0 ? wort*1000/payda : "X ≤ 9 — geçersiz", payda>0?0:undefined);
   put('hn_hd', V('hn_hac')>0 ? V('hn_cihaz')/V('hn_hac') : "—", V('hn_hac')>0?2:undefined);
 }});

   ${O('kdr_gizli','Gizli ısı oranı','')}
   ${O('kdr_hfg','Buharlaşma gizli ısısı','kJ/kg')}
   ${O('kdr_yog','Yoğuşma debisi','lt/h',1)}
   ${O('kdr_teorik','Teorik iç çap','mm')}
   ${O('kdr_ufak','Uzunluk faktörü','')}
   ${O('kdr_efak','Eğim faktörü','')}
   ${O('kdr_gerek','Gereken çap','mm')}
   ${O('kdr_ref','Referans tablo çapı','mm')}
   ${O('kdr_sec','Seçilen standart çap','mm',1)}
 </div></div>
 <div class="note">Uzunluk faktörü: &gt;30 m → 1,75 · &gt;15 m → 1,50 · &gt;5 m → 1,25 · diğer 1,00.
 Eğim faktörü: &lt;%1 → 1,25 · &lt;%1,5 → 1,10 · diğer 1,00. Teorik hidrolik çap pratikte çok küçük çıkar;
 seçim referans tablosu ve pratik minimum çap tarafından belirlenir. Standart çaplar: 16-20-25-32-40-50-63-75-90-110 mm.</div></div>`,
 calc:function(){
   const btu=V('kdr_btu'), gz=DRENAJ_GIZLI[S('kdr_mahal')]||0, hfg=HFG[S('kdr_t')]||2442.5;
   const yog = hfg>0 ? (btu/3412)*(gz/hfg)*3600 : 0;
   const adet = S('kdr_kol')==="Evet" ? Math.max(V('kdr_adet'),1) : 1;
   const hiz=V('kdr_hiz');
   const capOf = lh => { const m3s=lh/(3600*1000); return hiz>0 ? Math.sqrt(4*m3s/(Math.PI*hiz))*1000 : 0; };
   const teorik=Math.max(capOf(yog), capOf(yog*adet));
   const uz=V('kdr_uz'), eg=V('kdr_egim');
   const uf = uz>30?1.75:(uz>15?1.5:(uz>5?1.25:1));
   const ef = eg<1?1.25:(eg<1.5?1.1:1);
   const gerek=up(teorik*uf*ef);
   const ref=DRENAJ_REF.find(r=>btu>=r[0]&&btu<=r[1]);
   const refAlt = ref && ref[2]!=="—" ? parseFloat(ref[2].split('-')[0]) : 0;
   const hedef=Math.max(gerek,refAlt,V('kdr_min'));
   const sec=STD_CAP.find(c=>c>=hedef);
   put('kdr_gizli',gz,2); put('kdr_hfg',hfg,1); put('kdr_yog',yog,3);
   put('kdr_teorik',teorik,2); put('kdr_ufak',uf,2); put('kdr_efak',ef,2);
   put('kdr_gerek',gerek,0); put('kdr_ref', ref? ref[2] : "—");
   put('kdr_sec', sec!==undefined ? fmt(sec,0) : "tablo dışı (>110)");
 }});

 <div class="row2">
  <div class="card"><h3>Yöntem 2 — İniş Borusu Çapı</h3><div class="grid">
    ${F('y2_cati','Çatı alanı','150','m²')}
    ${F('y2_bos','Boşaltma faktörü','1','')}
    ${F('y2_siddet','Yağış şiddeti','534','l/s·ha')}
    ${F('y2_inis','Yağmur inişi adedi','1','adet')}
    ${F('y2_dol','Doluluk oranı (f)','0.2','')}
    ${F('y2_kb','Boru pürüzlülüğü (kb)','0.25','mm')}
    ${F('y2_oluk','Oluk yüksekliği','9.5','cm')}
  </div><div class="res" style="margin-top:12px"><div class="out">
    ${O('y2_debi','Yağış debisi','lt/s')}
    ${O('y2_bir','Bir iniş kapasitesi','lt/s')}
    ${O('y2_cap','Boru iç çapı','mm',1)}
    ${O('y2_alan','Boru iç alanı','cm²')}
    ${O('y2_kenar','Oluk diğer kenarı','cm',1)}
  </div></div><div class="note">d = ((Q·kb^(1/6)) ⁄ (2,5·10⁻⁴·f^(5/3)))^(3/8) — Prandtl-Colebrook türevi.
  Önerilen doluluk %20–%33.</div></div>

  <div class="card"><h3>Balkon / Teras Süzgeci</h3><div class="grid">
    ${F('bt_siddet','Yağış miktarı','500','l/s·ha')}

  </div></div></div>
 </div>`,
 calc:function(){
   const cap=V('y1_cap')/1000, alan=Math.pow(cap/2,2)*3.14;
   const top=V('y1_cati')*V('y1_yagmur');
   const lts=alan*V('y1_hiz')*1000;
   const dol=(lts*V('y1_dol'))/100;
   const dk=dol*3600, yk=dk*0.66;
   const dad= dk>0? top/dk : 0, yad= yk>0? top/yk : 0;
   put('y1_alan',alan,5); put('y1_top',top,0); put('y1_debi',dol,3);
   put('y1_dusey',dad,2); put('y1_yatay',yad,2);
   put('y1_dkare', Math.ceil(Math.sqrt(dad*alan)*100),0);
   put('y1_ykare', Math.ceil(Math.sqrt(yad*alan)*100),0);
   const f=Math.pow(V('y2_dol'),5/3), kb=Math.pow(V('y2_kb'),1/6);
   const q=(V('y2_cati')/10000)*V('y2_siddet')*V('y2_bos');
   const bir= V('y2_inis')>0 ? q/V('y2_inis') : 0;
   const c2 = (f>0) ? Math.pow((bir*kb)/(2.5e-4*f),3/8) : 0;
   const a2=3.14*Math.pow((c2/10)/2,2);
   put('y2_debi',q,3); put('y2_bir',bir,3); put('y2_cap',c2,2); put('y2_alan',a2,2);
   put('y2_kenar', V('y2_oluk')>0? a2/V('y2_oluk') : 0, 2);
   const bd=(V('bt_alan')*V('bt_siddet'))/10000;
   put('bt_debi',bd,1); put('bt_adet', V('bt_kap')>0? Math.ceil(bd/V('bt_kap')) : 0, 0);
 }});

MOD.push({grup:"Altyapı", id:"drenaj", ad:"Drenaj Kanalı", baslik:"Drenaj Kanalı ve Boru Kapasitesi",

 }});

 </div>`,

   const k=KAT[S('bc_yakit')]||0.012, h=V('bc_h');
   const alan = h>0 ? (k*V('bc_yuk'))/Math.sqrt(h) : 0;
   put('bc_kat',k,3); put('bc_alan',alan,2); put('bc_cap', Math.ceil(Math.sqrt(alan/3.14)*2), 0);
   const kap=V('bs_kap'), tip=S('bs_tip');
   const statu = kap>69 ? "Kazan Dairesi Statüsü" : (kap>49 ? "Cihaz Odası" : "Kombi");
   const acin=V('bs_duz')+V('bs_d90')*1+V('bs_d45')*0.5;
   put('bs_statu',statu); put('bs_acin',acin,2);
   let sart=[];
   if(statu==="Kazan Dairesi Statüsü") sart=["Alt-üst havalandırma",
     "Ex-proof gaz alarm, selenoid vana irtibatlı (gaz alarm kazan dairesinin hemen dışına)",
     "Karbonmonoksit alarm cihazı","Stop buton (tüm kazan dairesi elektriğini kesen)",
     "Ex-proof aydınlatma veya tavandan 30 cm aşağıya etanj aydınlatma",
     "Metal, dışa açılan kazan dairesi kapısı","Kazan dairesindeki elektrik panosu ex-proof olmalı"];
   else if(statu==="Cihaz Odası") sart=["Sadece üst havalandırma","Gaz alarm cihazı",
     "Cihaz odası için metal kapı zorunluluğu bulunmamaktadır"];
   else sart=["35 kW'tan sonra üst havalandırma"];
   let rapor=[];
   if(kap>69) rapor.push("Kapasite 69 kW üzerinde — baca raporu gerekli.");
   if(tip!=="Hermetik"){ rapor.push("Baca tipi hermetik değil — baca raporu gerekli.");
     rapor.push("5 m³/h tüketim üzerinde alt-üst havalandırma gerekli."); }
   if(acin>2.99) rapor.push("Açındırılmış baca uzunluğu 3 m ve üzeri — baca raporu isteniyor.");
   if(!rapor.length) rapor.push("Baca raporuna gerek yok.");
   $('bs_sartlar').innerHTML = `<div class="note" style="margin-top:12px"><b>Sağlanması gereken şartlar</b><br>`
     + sart.map(x=>"• "+x).join('<br>') + `</div>`
     + `<div class="note w" style="margin-top:10px"><b>Baca raporu</b><br>`+rapor.map(x=>"• "+x).join('<br>')+`</div>`;
 }});

MOD.push({grup:"Yerden Isıtma", id:"yzimodul", ad:"Zon / Modülasyon", baslik:"Zon Bazlı Yerden Isıtma ve Pratik Hesap",
 lead:"Zon ölçülerinden modülasyona göre metraj, ısıl güç ve su hacmi; ayrıca pratik alan hesabı.",
 html:(function(){
   let rows="";
   const d=[[22.5,6,2.7],[15,0,1],[22.5,0,3],[30,0,4],[37.5,0,5]];

      <td><input id="zm_b${i}" type="number" step="any" value="${r[2]}" oninput="calcAll()"></td>
      <td id="zm_alan${i}">—</td><td id="zm_met${i}">—</td><td id="zm_kcal${i}">—</td>
      <td id="zm_kw${i}">—</td><td id="zm_lt${i}">—</td><td id="zm_uy${i}"></td></tr>`; }
   return `<div class="card"><h3>Genel</h3><div class="grid">
     ${SEL('zm_cap','Boru çapı',["16","17"],"17")}
     ${F('zm_max','Kolektör ağzı maks. metraj','80','m')}
     ${F('zm_fire','Fire katsayısı','1.05','')}
     ${F('zm_hat','Kolektör-zon arası metraj (gidiş+dönüş)','20','m')}
   </div></div>
   <div class="card"><h3>Zonlar</h3><div class="wrap"><table>
    <thead><tr><th>Zon</th><th>Modülasyon<br>cm</th><th>A<br>m</th><th>B<br>m</th><th>Alan<br>m²</th>
    <th>Metraj<br>m</th><th>kcal/h</th><th>kW</th><th>Litre</th><th></th></tr></thead>
    <tbody>${rows}
     <tr><td>Kolektör hattı</td><td colspan="3">—</td><td>—</td><td id="zm_hatmet">—</td>
     <td id="zm_hatkcal">—</td><td id="zm_hatkw">—</td><td id="zm_hatlt">—</td><td></td></tr></tbody>
    <tfoot><tr><td colspan="5">TOPLAM</td><td id="zm_tmet">—</td><td id="zm_tkcal">—</td>
    <td id="zm_tkw">—</td><td id="zm_tlt">—</td><td></td></tr></tfoot></table></div>
    <div id="zm_uyari"></div>
    <div class="note">Metraj = (alan ⁄ (modülasyon⁄100)) · fire · 1 m boru gücü: Ø16 12,8 W/m, Ø17 13,5 W/m ·
    Su: Ø16 0,113, Ø17 0,133 lt/m.</div></div>

    <div class="card"><h3>Pratik Yerden Isıtma Hesabı</h3><div class="grid">
      ${F('py_alan','Isıtılacak alan','15','m²')}
      ${SEL('py_mod','Modülasyon tipi',["Sık aralık (6,6 m/m² — 15 cm)","Normal (4,4 m/m² — 22,5 cm)","Geniş (3,3 m/m² — 30 cm)"],"Geniş (3,3 m/m² — 30 cm)")}
      ${SEL('py_cap','Boru çapı',["16","17"],"16")}
      ${F('py_sap','Şap kalınlığı','4','cm')}
      ${F('py_max','Kolektör ağzı maks. metraj','80','m')}
      ${F('py_agiz','İstenen ağız sayısı','8','ağız')}
    </div><div class="res" style="margin-top:12px"><div class="out">
      ${O('py_m2met','m² başına metraj','m/m²')}
      ${O('py_aralik','Modülasyon aralığı','cm')}
      ${O('py_met','Boru metrajı','m',1)}
      ${O('py_kap','Isıtıcı kapasitesi','kW',1)}
      ${O('py_birim','Birim ısı','W/m²')}
      ${O('py_w','Ortama verilen ısı','W',1)}
      ${O('py_kcal','Ortama verilen ısı','kcal/h')}
      ${O('py_agizg','Gerekli ağız sayısı','ağız')}
      ${O('py_kol','Kolektör adedi','adet',1)}
    </div></div><div id="py_uyari"></div>
    <div class="note">Birim ısı = (Ø16: 12,8 · Ø17: 13,5) · m²metraj − (şap − 3) · (Ø16: 6,8 · Ø17: 7,5).
    Kapasite katsayısı Ø16 11,87 W/m, Ø17 12,5 W/m.</div></div>`;
 })(),
 calc:function(){
   const cap=S('zm_cap'), w = cap==="17"?13.5:12.8, ltm = cap==="16"?0.113:0.133;
   const fire=V('zm_fire'), maxm=V('zm_max');
   let tmet=0;
   for(let i=0;i<5;i++){
     const alan=V('zm_a'+i)*V('zm_b'+i), mod=parseFloat(S('zm_mod'+i));
     const met = mod>0 ? (alan/(mod/100))*fire : 0;
     const kcal=(met*w)/1000*KCAL;
     put('zm_alan'+i,alan,2); put('zm_met'+i,met,2); put('zm_kcal'+i,kcal,1);
     put('zm_kw'+i,kcal/KCAL,3); put('zm_lt'+i,ltm*met,2);
     $('zm_uy'+i).innerHTML = (maxm>0&&met>maxm) ? '<span class="chip" style="background:var(--warn-soft);color:var(--warn)">sınır aşıldı</span>' : '';
     tmet+=met;
   }
   const hat=V('zm_hat'), hkcal=(hat*w)/1000*KCAL;
   put('zm_hatmet',hat,2); put('zm_hatkcal',hkcal,1); put('zm_hatkw',hkcal/KCAL,3); put('zm_hatlt',ltm*hat,2);
   const tt=tmet+hat, tkcal=(tt*w)/1000*KCAL;
   put('zm_tmet',tt,2); put('zm_tkcal',tkcal,1); put('zm_tkw',tkcal/KCAL,3); put('zm_tlt',ltm*tt,2);
   $('zm_uyari').innerHTML = (maxm>0 && tmet>maxm)
     ? '<div class="note w" style="margin-top:10px"><b>Not:</b> toplam metraj tek ağız sınırını aşıyor — '
       +'toplam en az '+up(tmet/maxm)+' kolektör ağzına bölünmelidir.</div>' : '';
   const m2met = S('py_mod').startsWith("Sık")?6.6:(S('py_mod').startsWith("Normal")?4.4:3.3);
   const aralik = m2met===6.6?15:(m2met===4.4?22.5:30);
   const pcap=S('py_cap'), palan=V('py_alan'), pmet=palan*m2met;
   const kapkw = (pcap==="16" ? pmet*11.87 : pmet*12.5)/1000;
   const birim = (pcap==="16") ? (12.8*m2met-(V('py_sap')-3)*6.8) : (13.5*m2met-(V('py_sap')-3)*7.5);
   const pw=birim*palan;
   const agz = V('py_max')>0 ? pmet/V('py_max') : 0;
   put('py_m2met',m2met,2); put('py_aralik',aralik,1); put('py_met',pmet,2);
   put('py_kap',kapkw,3); put('py_birim',birim,2); put('py_w',pw,1); put('py_kcal',pw/1000*KCAL,1);
   put('py_agizg',agz,2); put('py_kol', V('py_agiz')>0? agz/V('py_agiz') : 0, 3);
   $('py_uyari').innerHTML = V('py_sap')<3.5
     ? '<div class="note w" style="margin-top:10px"><b>Dikkat:</b> şap kalınlığı 3,5 cm altında — '
       +'boru üzeri şap kalınlığı yetersiz.</div>' : '';
 }});

MOD.push({grup:"Isıtma", id:"ckollektor", ad:"C-Kollektör", baslik:"Kollektör (C Tipi) Ölçü Hesabı",
 lead:"Kazan kapasitesi ve ΔT'den su debisi, kollektör boru çapı ve gövde ölçüleri.",
 html:`<div class="card"><h3>Giriş</h3><div class="grid">
   ${F('ck_kw','Kazan kapasitesi','600','kW')}
   ${F('ck_dt','Sıcaklık farkı ΔT','20','°C')}
   ${F('ck_yog','Su yoğunluğu','992.1','kg/m³')}
   ${F('ck_cp','Suyun özgül ısısı','4.179','kJ/kg°C')}
   ${F('ck_hiz','Su akış hızı','0.7','m/s')}
 </div><div class="res" style="margin-top:14px"><div class="out">
   ${O('ck_debi','Su debisi','m³/s')}
   ${O('ck_m3h','Su debisi','m³/h')}
   ${O('ck_d1','Bağlantı borusu çapı D1','mm',1)}
   ${O('ck_d2','Kollektör gövde çapı D2','mm',1)}
   ${O('ck_a1','A1 ölçüsü','cm')}
   ${O('ck_a2','A2 ölçüsü','cm')}
   ${O('ck_a3','A3 ölçüsü','cm')}
 </div></div>
 <div class="note">D2 = 2·D1 · A1 = D2·0,35 · A2 = D2·0,40 · A3 = D2·0,50 (cm).

 havuz 15 °C (45–60 °C, eşanjör tarafı).</div></div>`,
 calc:function(){
   const payda=V('ck_yog')*V('ck_cp')*V('ck_dt');
   const q = payda>0 ? V('ck_kw')/payda : 0;
   const v=V('ck_hiz');
   const d1 = v>0 ? Math.sqrt(q*4/(3.14*v))*1000 : 0;
   const d2=d1*2;
   put('ck_debi',q,6); put('ck_m3h',q*3600,3); put('ck_d1',d1,2); put('ck_d2',d2,2);
   put('ck_a1',(d2*3.5)/10,2); put('ck_a2',(d2*4)/10,2); put('ck_a3',(d2*5)/10,2);
 }});

   const q = dtv>0 ? V('sv_kw')/(1.163*dtv) : 0;
   const VANA=[[0.55,'R½"'],[1.0,'R¾" / DN 20'],[1.5,'R1" / DN 25'],[2.2,'DN 32'],[3.5,'DN 40'],[5.5,'DN 50']];
   const v=VANA.find(x=>q<=x[0]);
   put('sv_debi',q,2); put('sv_vana', v? v[1] : "DN 50 üzeri — kontrol edin");
   const dts=V('ss_gid')-V('ss_don');
   const lts = dts>0 ? V('ss_kw')*1000/(4.2*1000*dts) : 0;
   put('ss_dt',dts,1); put('ss_lts',lts,3); put('ss_m3',lts*3.6,2); put('ss_sont',lts*3.6/3,2);

 }});

   ];
   $('rh_liste').innerHTML = `<tr><td colspan="2"><b>Hesaplanan alan / metraj</b></td>
     <td><b>${fmt(alan,1)} m² · ${fmt(metraj,1)} m</b></td></tr>`

 }});

MOD.push({grup:"Referans", id:"iscilik", ad:"Islak Hacim İşçilik", baslik:"Islak Hacim İşçilik Metrajı",
 lead:"Banyo / WC / mutfak mekanik tesisat işçiliğinin adam-saat ve maliyet metrajı.",
 html:(function(){
   let h=`<div class="card"><h3>Fiyat Girdileri</h3><div class="grid">
     ${F('is_saat','İşçilik saat ücreti','500','TL/saat')}
     ${F('is_kur','Euro kuru','50.12','TL/€')}
     ${F('is_bag','Bağlantı elemanları katsayısı','0.65','')}
   </div><div class="note">1 adam/saat = 1 kişinin 1 saat çalışması. Bağlantı elemanları katsayısı,
   temiz su ve atık su gruplarında boru işçiliğinin üzerine ek fittings montaj işçiliği olarak eklenir.</div></div>`;
   ISCILIK.forEach((g,gi)=>{
     h+=`<div class="card"><h3>${g[0]}</h3><div class="wrap"><table>
       <thead><tr><th>Kalem</th><th>Birim adam/saat</th><th>Miktar (${g[1]})</th>
       <th>Adam/saat</th><th>TL</th><th>€</th></tr></thead><tbody>`;
     g[3].forEach((it,ii)=>{
       h+=`<tr><td>${it[0]}</td><td>${fmt(it[1],2)}</td>
         <td><input id="is_${gi}_${ii}" type="number" step="any" value="0" oninput="calcAll()"></td>
         <td id="ish_${gi}_${ii}">—</td><td id="ist_${gi}_${ii}">—</td><td id="ise_${gi}_${ii}">—</td></tr>`;
     });
     if(g[2]) h+=`<tr><td colspan="3">Bağlantı elemanları işçiliği</td><td>—</td>
       <td id="isbt_${gi}">—</td><td id="isbe_${gi}">—</td></tr>`;
     h+=`</tbody><tfoot><tr><td colspan="3">GRUP TOPLAMI</td><td id="isgh_${gi}">—</td>
       <td id="isgt_${gi}">—</td><td id="isge_${gi}">—</td></tr></tfoot></table></div></div>`;
   });
   h+=`<div class="card"><h3>Genel Toplam</h3><div class="res"><div class="out">
     ${O('is_th','Toplam işçilik','adam/saat',1)}
     ${O('is_ttl','Toplam işçilik','TL',1)}
     ${O('is_teur','Toplam işçilik','€',1)}
   </div></div>
   <div class="note w"><b>Not:</b> Bağlantı elemanları payı orijinal tabloda yalnızca parasal toplamlara
   ekleniyor, adam/saat toplamına eklenmiyordu. Burada da aynı davranış korunmuştur — bu yüzden
   "toplam adam/saat × saat ücreti" ile "toplam TL" birbirini tutmaz; fark bağlantı elemanları payıdır.</div></div>`;
   return h;
 })(),
 calc:function(){
   const saat=V('is_saat'), kur=V('is_kur')||1, bag=V('is_bag');
   let TH=0,TTL=0,TEUR=0;
   ISCILIK.forEach((g,gi)=>{
     let gh=0,gtl=0;
     g[3].forEach((it,ii)=>{
       const m=V(`is_${gi}_${ii}`), h=m*it[1], tl=h*saat;
       put(`ish_${gi}_${ii}`,h,2); put(`ist_${gi}_${ii}`,tl,2); put(`ise_${gi}_${ii}`,tl/kur,2);
       gh+=h; gtl+=tl;
     });
     let btl=0;
     if(g[2]){ btl=gtl*bag; put(`isbt_${gi}`,btl,2); put(`isbe_${gi}`,btl/kur,2); }
     const top=gtl+btl;
     put(`isgh_${gi}`,gh,2); put(`isgt_${gi}`,top,2); put(`isge_${gi}`,top/kur,2);
     TH+=gh; TTL+=top; TEUR+=top/kur;
   });
   put('is_th',TH,2); put('is_ttl',TTL,2); put('is_teur',TEUR,2);
 }});

function fanDebisi(pts, basinc){            // verilen basınçta modelin verebileceği debi
  const n=pts.length/2;
  let p0=pts[0], q0=pts[1];
  if(basinc<=p0) return q0;
  for(let i=1;i<n;i++){
    const p=pts[2*i], q=pts[2*i+1];
    if(basinc<=p){ const t=(basinc-p0)/(p-p0); return q0+t*(q-q0); }
    p0=p; q0=q;
  }
  return 0;
}
function fanSec(tip, debi, basinc){
  const liste = FAN_DB[tip]||[];
  const adaylar=[];
  for(const [ad,pts] of liste){
    const q=fanDebisi(pts,basinc);
    if(q>=debi) adaylar.push({ad, q, fiyat: FAN_DB.FIYAT[ad]});
  }
  if(!adaylar.length) return {ad:"Karşılanmıyor", not:"Bu debi/basınç için katalogda uygun model yok."};
  const fiyatli = adaylar.filter(a=>a.fiyat!==undefined);
  const havuz = fiyatli.length? fiyatli : adaylar;
  havuz.sort((a,b)=>(a.fiyat||1e9)-(b.fiyat||1e9));
  return {...havuz[0], aday:adaylar.length};
}

/* Otopark kesit elemanları: [ad, kol(th|dt), varsayılan hız, serbest alan, varsayılan ölçü1] */

/* [ad, kol, hız, serbest alan, ölçü1, sürtünme kaybı hesaplanır mı] */
const OP_ELEMAN = [
 ["Taze hava damperi","th",5,1,2000,false],

/* Colebrook-White sürtünme katsayısı (iteratif) */
function colebrook(Re, eps_m, Dh_m){
  if(!isFinite(Re) || Re<=0 || Dh_m<=0) return 0;
  if(Re<2300) return 64/Re;
  let f = 0.25/Math.pow(Math.log10((eps_m/(3.7*Dh_m))+(5.74/Math.pow(Re,0.9))),2);
  for(let i=0;i<20;i++){
    const rhs = -2*Math.log10((eps_m/(3.7*Dh_m))+(2.51/(Re*Math.sqrt(f))));
    const fn = 1/(rhs*rhs);
    if(Math.abs(fn-f)<1e-10){ f=fn; break; }
    f=fn;
  }
  return f;
}
function opKesitSatir(pre){
  return OP_ELEMAN.map((e,i)=>`<tr><td style="text-align:left">${e[0]}</td>
    <td id="${pre}_q${i}">—</td>
    <td><input id="${pre}_v${i}" type="number" step="0.5" value="${e[2]}" oninput="calcAll()"></td>
    <td><input id="${pre}_s${i}" type="number" step="0.05" value="${e[3]}" oninput="calcAll()"></td>
    <td id="${pre}_a${i}">—</td>
    <td><input id="${pre}_o${i}" type="number" step="50" value="${e[4]}" oninput="calcAll()"></td>
    <td><input id="${pre}_n${i}" type="number" step="1" value="1" oninput="calcAll()"></td>
    <td id="${pre}_m${i}">—</td>
    <td>${e[5] ? `<input id="${pre}_L${i}" type="number" step="0.5" value="0" oninput="calcAll()">`
               : `<span style="color:var(--muted)">—</span>`}</td>
    <td id="${pre}_p${i}">—</td><td id="${pre}_pf${i}">—</td><td id="${pre}_pt${i}">—</td></tr>`).join('');
}
function opKesitBaslik(){
  return `<thead><tr><th>Eleman</th><th>Debi<br>m³/h</th><th>Hız<br>m/s</th><th>Serbest<br>alan</th>
    <th>Alan<br>m²</th><th>Ölçü 1<br>mm</th><th>Adet</th><th>Ölçü 2<br>mm</th><th>Şaft<br>uzunluğu m</th>
    <th>Yerel<br>Pa</th><th>Sürtünme<br>Pa</th><th>Toplam<br>Pa</th></tr></thead>`;
}
function opKesitHesap(pre, thDebi, dtDebi){
  let thPa=0, dtPa=0;
  const eps=V('op_eps')/1000, nu=V('op_nu')*1e-6, rho=1.2;
  OP_ELEMAN.forEach((e,i)=>{
    const q = e[1]==="th" ? thDebi : dtDebi;
    const v=V(pre+'_v'+i), sa=V(pre+'_s'+i), o1=V(pre+'_o'+i), n=Math.max(V(pre+'_n'+i),0);
    const a = (v>0&&sa>0)? q/v/3600/sa : 0;
    const o2 = (o1>0&&n>0)? a*1e6/o1/n : 0;
    const pa = 1.5*v*v;
    const L=e[5] ? V(pre+'_L'+i) : 0;
    let pf=0;
    if(e[5] && L>0 && o1>0 && o2>0 && v>0){
      const A=(o1/1000), B=(o2/1000);
      const dh = 2*A*B/(A+B);
      const re = nu>0 ? v*dh/nu : 0;
      const f = colebrook(re, eps, dh);
      pf = f*(L/dh)*(rho*v*v/2);
    }
    put(pre+'_q'+i,q,0); put(pre+'_a'+i,a,3); put(pre+'_m'+i,o2,0);
    put(pre+'_p'+i,pa,1);
    put(pre+'_pf'+i, e[5] ? fmt(pf,1) : "—");
    put(pre+'_pt'+i,pa+pf,1);
    if(e[1]==="th") thPa+=pa+pf; else dtPa+=pa+pf;
  });
  return [thPa,dtPa];
}

 })(),
 calc:function(){
   const yontem=S('op_yontem'), ach=OP_DUMAN_ACH;
   const hiz=OP_ACIKLIK_HIZ;
   let talan=0, thacim=0, tgun=0, tdum=0, taq=0, tnf=0, gkat=0;
   let kritik=0, kritikAd="—", yanginFan=0, yanginKat="—";
   const kat=[];
   for(let i=0;i<8;i++){
     const alan=V('ot_alan'+i), yuk=V('ot_yuk'+i);
     const hac=alan*yuk;
     const gun = yontem.startsWith("Konut") ? alan*6 : alan*12;
     const dum=hac*ach;
     const ay = V('ot_ay'+i)>0 ? V('ot_ay'+i) : yuk;
     const aq = V('ot_ae'+i)*ay*hiz*3600;
     const nf = Math.max(gun*OP_TAZE_ORAN-aq,0);
     const yf = Math.max(dum*OP_TAZE_ORAN-aq,0);
     const ad = $('ot_ad'+i)? $('ot_ad'+i).value : ("Kat "+(i+1));
     put('ot_hac'+i, hac>0? fmt(hac,1) : "—");
     put('ot_aq'+i, aq>0? fmt(aq,0) : "—");
     put('ot_gun'+i, alan>0? fmt(gun,0) : "—");
     put('ot_nf'+i, alan>0? fmt(nf,0) : "—");
     put('ot_dum'+i, hac>0? fmt(dum,0) : "—");
     put('ot_yf'+i, hac>0? fmt(yf,0) : "—");
     kat.push({i,ad,alan,hac,dum,aq,gun,nf,yf});
     talan+=alan; thacim+=hac; tgun+=gun; tdum+=dum; taq+=aq; tnf+=nf;
     if(aq>0) gkat++;
     if(dum>kritik){ kritik=dum; kritikAd=ad; }
     if(hac>0 && yf>yanginFan){ yanginFan=yf; yanginKat=ad; }
   }
   kat.forEach(k=>{
     let c="";
     if(k.dum>0 && k.dum===kritik) c+='<span class="chip">kritik kat</span> ';
     if(k.hac>0 && k.aq>0 && k.nf===0 && k.yf===0) c+='<span class="chip" style="background:var(--res);color:var(--ok)">fan gerekmez</span>';
     $('ot_kr'+k.i).innerHTML=c;
   });
   put('op_talan',talan,1); put('op_hacim',thacim,1); put('op_gundebi',tgun,0);
   put('op_gunlukbel',tnf,0); put('op_gdebi',taq,0); put('op_tdum',tdum,0);
   put('op_ghiz',hiz,1); put('op_gtoplam',taq,0); put('op_gkat',gkat,0);
   put('op_normihtiyac',tgun,0);
   put('op_kritik',kritikAd); put('op_kritikdebi',kritik,0);
   put('op_yangintaze',kritik*OP_TAZE_ORAN,0);
   const yanginBelirler = kritik>=tgun;
   const belirleyici=Math.max(kritik,tgun);
   put('op_duman',belirleyici,0);
   put('op_belirleyen', yanginBelirler ? "Yangın anı (kritik kat)" : "Normal zaman (tüm katlar)");
   const yuzde70 = belirleyici*OP_TAZE_ORAN;
   put('op_yuzde70',yuzde70,0);
   /* A: yangın her katta çıkabilir → katların en kötüsü · B: normal işletmede tüm katlar birlikte */
   const A = yanginFan, B = tnf;
   const taze = Math.max(A,B);
   put('op_taze',taze,0);
   put('op_acikdus', taq>0 ? fmt(yuzde70-taze,0) : "açıklık yok");
   put('op_tazebel', taze<=0 ? "gerekli değil"
     : (A>=B ? "Yangın anı — "+yanginKat : "Normal zaman (tüm katlar)"));
   let tnot='';
   if(taze<=0 && taq>0) tnot='<div class="note w" style="margin-top:9px">Tüm katlarda giriş açıklıkları'
     +' taze hava ihtiyacını karşılıyor — taze hava fanı gerekli değil.</div>';
   else if(taq>0) tnot='<div class="note" style="margin-top:9px">Yangın senaryosu '
     +(A>=B?'belirleyici':'belirleyici değil')+': açıklığı yetersiz en kötü kat <b>'+yanginKat+'</b> ('
     +fmt(A,0)+' m³/h) · normal işletmede tüm katların fandan ihtiyacı toplamı '+fmt(B,0)+' m³/h.</div>';
   $('op_tazenot').innerHTML = tnot;
   put('op_konut',talan*6,0); put('op_ticari',talan*12,0);
   const buyukZon = kat.some(k=>k.alan>5000);
   $('op_zonuyari').innerHTML = buyukZon
     ? '<div class="note w" style="margin-top:10px"><b>Uyarı:</b> bir katın alanı 5.000 m² zon sınırını'
       +' aşıyor — o kat duman tahliye zonlarına bölünmelidir.</div>' : '';
   const nTH=Math.max(V('op_thfan'),1), nDT=Math.max(V('op_dtfan'),1);
   const thDebi=up((taze/nTH)/1000)*1000, dtDebi=up((belirleyici/nDT)/1000)*1000;
   put('op_thdebi',thDebi,0); put('op_dtdebi',dtDebi,0);
   /* karşı basınç önce kesit tablosundan hesaplanır, fan ona göre seçilir */
   const [thPa,dtPa]=opKesitHesap('opk', thDebi*nTH, dtDebi*nDT);
   put('op_thpa',thPa,1); put('op_dtpa',dtPa,1);
   const emn=1+V('op_emniyet')/100;
   const thBas=Math.ceil(thPa*emn/10)*10, dtBas=Math.ceil(dtPa*emn/10)*10;
   put('op_thbas',thBas,0); put('op_dtbas',dtBas,0);
   const s1=fanSec('BF',thDebi,thBas), s2=fanSec('DTF',dtDebi,dtBas);
   put('op_thsec', thDebi>0? s1.ad : "gerekli değil");
   put('op_thfiyat', thDebi>0 && s1.fiyat!==undefined ? fmt(s1.fiyat,0) : "—");
   put('op_dtsec', dtDebi>0? s2.ad : "—");
   put('op_dtfiyat', dtDebi>0 && s2.fiyat!==undefined? fmt(s2.fiyat,0) : "—");
   const [mThPa,mDtPa]=opKesitHesap('opm', V('opm_th'), V('opm_dt'));
   put('opm_thpa',mThPa,1); put('opm_dtpa',mDtPa,1);
 }});

 </div></div>
 <div id="mb_uyari"></div>

 (pratikte ΔP ≤ ~70 Pa) · emniyet katsayıları: sızıntı ×1,50, açık kapı ×1,10 ·

 calc:function(){
   const kat=V('mb_kat'), acik=V('mb_acik'), kapali=kat-acik;
   const carpan = S('mb_ae_baz').startsWith("Kapalı") ? kapali : kat;
   const ae=carpan*V('mb_ae');
   const dp=V('mb_dp'), rho=V('mb_rho');
   const q1s = S('mb_form').startsWith("Firma") ? 0.83*ae*Math.sqrt(dp) : V('mb_c')*ae*Math.sqrt(2*dp/rho);
   const q1=q1s*V('mb_em1')*3600;
   const q2=V('mb_v')*(V('mb_ken')*V('mb_kyu')*acik)*V('mb_em2')*3600;
   const qtop=q1+q2, qm3s=qtop/3600;
   put('mb_kapali',kapali,0); put('mb_aetop',ae,4);
   put('mb_q1',q1,0); put('mb_q2',q2,0); put('mb_qtop',qtop,0);
   put('mb_qsec',Math.round(qtop/1000)*1000,0);
   const D=V('mb_cap')/1000, A=Math.PI/4*D*D;
   const v = A>0 ? qm3s/A : 0;
   const nu=V('mb_nu')*1e-5;
   const re = nu>0 ? v*D/nu : 0;
   const rel = D>0 ? (V('mb_eps')/1000)/D : 0;
   const f = re<=0 ? 0 : (re<2300 ? 64/re : 0.25/Math.pow(Math.log10(rel/3.7+5.74/Math.pow(re,0.9)),2));
   const pdyn=rho*v*v/2;
   const dpsur = D>0 ? f*(V('mb_L')/D)*pdyn : 0;
   const zeta=V('mb_d90')*0.17+V('mb_te')*1+V('mb_menfez')*2.5+V('mb_fd')*1+V('mb_vcd')*1.5;
   const dpyer=zeta*pdyn+V('mb_filtre')*250;
   const dptop=dpsur+dpyer;
   const eta=V('mb_verim')/100;
   put('mb_v',v,2); put('mb_re',re,0); put('mb_f',f,5); put('mb_pdyn',pdyn,2);
   put('mb_dpsur',dpsur,2); put('mb_dpyer',dpyer,2); put('mb_dptop',dptop,2);
   put('mb_hst',V('mb_ek')+dptop,2);
   put('mb_guc', eta>0 ? fmt(qm3s*(V('mb_ek')+dptop)/eta/1000,3) : "verim sıfır");
   let u=[];
   if(v>15) u.push("Kanal hızı "+fmt(v,1)+" m/s — basınçlandırma kanallarında tipik üst sınır 10–15 m/s. Kanal çapını büyütün.");
   if(dp>70) u.push("Kapalı kapı ΔP "+fmt(dp,0)+" Pa — NFPA 92'ye göre kapı açma kuvveti 133 N sınırını aşabilir (ΔP ≤ ~70 Pa).");
   if(V('mb_v')<0.75) u.push("Açık kapı hızı 0,75 m/s'nin altında — NFPA 92 minimumunu karşılamıyor.");
   $('mb_uyari').innerHTML = u.length ? '<div class="note w" style="margin-top:10px"><b>Uyarı</b><br>'
     +u.map(x=>"• "+x).join('<br>')+'</div>' : '';
 }});

 <div class="note">Menzil = Cf · K · D · V_eff ⁄ Vx. Model yalnızca x &gt; 6·D bölgesinde geçerlidir.
 K değerleri: 3,5 muhafazakâr (swirl'li çıkış) · 4,4 literatür alt sınırı · 5,3 tipik serbest yuvarlak jet ·
 5,8 literatür üst sınırı.</div></div>

 <div class="card"><h3>K Duyarlılığı</h3><div class="wrap"><table id="jf_duyar"></table></div></div>`,
 calc:function(){
   const D=V('jf_cap')/1000, q=V('jf_debi')/3600, rho=V('jf_rho');
   const a0=Math.PI*D*D/4;
   const v0 = a0>0 ? q/a0 : 0;
   const F=rho*q*v0;
   const itme=V('jf_itme');
   const veff = (itme>0 && rho*q>0) ? itme/(rho*q) : v0;
   const xmin=6*D;
   put('jf_a0',a0,5); put('jf_m3s',q,4); put('jf_v0',v0,2);
   put('jf_f',F,2); put('jf_veff',veff,2); put('jf_xmin',xmin,2);
   const K=V('jf_k'), cf=V('jf_cf');
   const hedefler=[[0.5,"Duman kontrolünde düşük hız kriteri"],[1,"Otopark jet fanlarında standart menzil"],
     [1.5,"Kritik hız üst bandı (duman geri akışını önleme)"],[2,"Etkin süpürme bölgesi"],
     [5,"Fan yakını yüksek hız bölgesi"]];
   $('jf_menzil').innerHTML = hedefler.map(([vx,ac])=>{
     const m = vx>0 ? cf*K*D*veff/vx : 0;
     const ok = m>=xmin;
     return `<tr><td>${fmt(vx,1)}</td><td>${fmt(m,2)}</td><td>${fmt(D>0?m/D:0,1)}</td>
       <td>${ok?'<span class="chip">Evet</span>':'<span class="chip" style="background:var(--warn-soft);color:var(--warn)">Çok yakın</span>'}</td>
       <td style="text-align:left">${ac}</td></tr>`;
   }).join('');
   const Ks=[3.5,4.4,5.3,5.8];
   $('jf_duyar').innerHTML = `<thead><tr><th>K</th>${hedefler.map(h=>`<th>${fmt(h[0],1)} m/s</th>`).join('')}</tr></thead>`
     + `<tbody>${Ks.map(k=>`<tr><td>${fmt(k,1)}</td>`+hedefler.map(h=>
        `<td>${fmt(h[0]>0? cf*k*D*veff/h[0] : 0,2)}</td>`).join('')+`</tr>`).join('')}</tbody>`;
 }});

 })(),
 calc:function(){
   const eps=V('fh_eps'), nu=V('fh_nu'); let toplam=0;
   for(let i=0;i<10;i++){
     const yuv = S('fh_t'+i)==="Yuvarlak";
     const a=V('fh_a'+i), b=V('fh_b'+i), q=V('fh_q'+i), L=V('fh_L'+i);
     if(!(q>0 && a>0 && (yuv || b>0))){ ['dh','v','R','p'].forEach(k=>put('fh_'+k+i,"—")); continue; }
     const dh = yuv ? a : 1.3*Math.pow(a*b,0.625)/Math.pow(a+b,0.25);
     const ls=q*1000/3600;
     const vD=1273.24*ls/(dh*dh);
     const re=vD*dh*1e6/(1e3*nu);
     const f=1.325/Math.pow(Math.log(eps/(3.7*dh)+5.74/Math.pow(re,0.9)),2);
     const R=600*f*vD*vD/dh;
     const pv=0.6*vD*vD;
     const zeta=V('fh_d'+i)*KANAL_ZETA.dirsek+V('fh_te'+i)*KANAL_ZETA.te
              + V('fh_dm'+i)*KANAL_ZETA.damper+V('fh_g'+i)*KANAL_ZETA.giris;
     const kayip=R*L+zeta*pv;
     put('fh_dh'+i,dh,2); put('fh_v'+i,vD,2); put('fh_R'+i,R,3); put('fh_p'+i,kayip,2);
     toplam+=kayip;

 }});

 html:`<div class="card"><h3>Giriş</h3><div class="grid">
   ${F('ib_debi','Hava debisi','3700','m³/h')}
   ${F('ib_rho','Hava yoğunluğu','1.2','kg/m³')}
   ${F('ib_cp','Özgül ısı','0.28','Wh/kg·K')}
   ${F('ib_tkis','Dış hava sıcaklığı (kış)','-3','°C')}
   ${F('ib_tyaz','Dış hava sıcaklığı (yaz)','33','°C')}
   ${F('ib_tm','Mahal sıcaklığı','20','°C')}
   ${F('ib_verim','Isı geri kazanım verimi','0.6','')}
 </div>
 <div class="res" style="margin-top:12px"><div class="out">
   ${O('ib_qkis','Geri kazanılan ısı (kış)','W',1)}
   ${O('ib_qyaz','Geri kazanılan ısı (yaz)','W')}
   ${O('ib_tisk','Geri kazanım sonrası sıcaklık','°C',1)}
   ${O('ib_bat','Isıtıcı batarya kapasitesi','W',1)}
   ${O('ib_batkw','Isıtıcı batarya kapasitesi','kW')}
 </div></div>
 <div class="note">Q = V · ρ · Cp · ΔT · verim · T_ısk = T_dış + verim·(T_mahal − T_dış) ·
 Batarya = V·ρ·Cp·(T_mahal − T_ısk), 100 W'a yukarı yuvarlanır.
 Isı geri kazanım verimi: kare tip 0,4–0,6 · altıgen tip 0,9.</div></div>`,
 calc:function(){
   const V0=V('ib_debi'), rho=V('ib_rho'), cp=V('ib_cp');
   const tkis=V('ib_tkis'), tm=V('ib_tm'), n=V('ib_verim');
   const vrc=V0*rho*cp;
   const qkis=vrc*(tm-tkis)*n, qyaz=vrc*(V('ib_tyaz')-tm)*n;
   const tisk = vrc>0 ? qkis/vrc+tkis : tkis;
   const bat=Math.ceil(vrc*(tm-tisk)/100)*100;
   put('ib_qkis',qkis,1); put('ib_qyaz',qyaz,1); put('ib_tisk',tisk,2);
   put('ib_bat',bat,0); put('ib_batkw',bat/1000,2);
 }});

 </div></div>

   let secilen=KASNAK_CAP[0], best=1e9;
   KASNAK_CAP.forEach(c=>{ const d=Math.abs(c-gerekli); if(d<best){best=d; secilen=c;} });
   const gercek = secilen>0 ? md*mk/secilen : 0;
   const kesit = guc<7.5 ? 13 : 17;
   const adet = guc<4.1 ? 2 : (guc<=18.5 ? 3 : (guc<=30 ? 4 : 5));

   const C=V('ks_merkez'), D=secilen, d0=mk;
   const uz = C>0 ? 2*C+(Math.PI/2)*(D+d0)+Math.pow(D-d0,2)/(4*C) : 0;

   put('ks_motormil', mil!==undefined? fmt(mil,0) : "tabloda yok");

   put('ks_motoret', mk+" / "+(mil!==undefined?mil:"?")+" - "+kesit+" / "+adet);

   $('ks_uyari').innerHTML = u.length? '<div class="note w" style="margin-top:10px"><b>Uyarı</b><br>'
     +u.map(x=>"• "+x).join('<br>')+'</div>' : '';
   const P=V('st_yuk'), a=V('st_a'), L=V('st_L');
   put('st_r1', L>0? P*(a+L)/L : 0, 2); put('st_r2', L>0? P*a/L : 0, 2);
 }});

const KB = {seg:[], fit:[], acc:[], no:1, ilk:false};
function kbHavaYog(t){ return 101325/(287.05*(t+273.15)); }
function kbViskozite(t){ const T=t+273.15,T0=273.15,mu0=1.716e-5,C=110.4;
  return mu0*Math.pow(T/T0,1.5)*(T0+C)/(T+C); }
function kbGeo(s){
  if(s.tip==="Dairesel"){ const D=s.d/1000; return {A:Math.PI/4*D*D, Dh:D}; }
  const a=s.a/1000, b=s.b/1000; return {A:a*b, Dh:(a+b)>0? 2*a*b/(a+b) : 0};
}
function kbSegEkle(){ KB.seg.push({id:KB.no++, ad:"Kanal "+(KB.seg.length+1), tip:"Dairesel",

function kbFitEkle(){ KB.fit.push({id:KB.no++, ad:"Yerel kayıp "+(KB.fit.length+1),
  seg:KB.seg[0]?KB.seg[0].id:null, tip:"90° dirsek (yuvarlak, r/D=1,5)", adet:1,

function kbAccEkle(){ KB.acc.push({id:KB.no++, ad:"Damper "+(KB.acc.length+1),
  kaynak:"Kanal segmentinden", seg:KB.seg[0]?KB.seg[0].id:null, serbest:0.1, hiz:3,
  yontem:"ζ katsayısı", tip:"Kelebek damper (tam açık)", zeta:0.3, refDP:30, refV:3}); kbCiz(); calcAll(); }
function kbSil(liste,id){ const a=KB[liste]; const i=a.findIndex(x=>x.id===id); if(i>-1) a.splice(i,1);
  const ilk=KB.seg[0]?KB.seg[0].id:null;
  KB.fit.forEach(f=>{ if(!KB.seg.some(s=>s.id===f.seg)) f.seg=ilk; if(!KB.seg.some(s=>s.id===f.segB)) f.segB=ilk; });
  KB.acc.forEach(x=>{ if(!KB.seg.some(s=>s.id===x.seg)) x.seg=ilk; });

function kbSet(liste,id,alan,deger,yeniden){
  const o=KB[liste].find(x=>x.id===id); if(!o) return;

          : (alan==="seg"||alan==="segB") ? parseInt(deger)
          : (parseFloat(String(deger).replace(',','.'))||0);

}
function kbSegSec(secili,liste,id,alan){

  $('kb_fit').innerHTML = KB.fit.length ? KB.fit.map(f=>`

     ${a.kaynak==="Kanal segmentinden" ? `<div><label>Segment</label>${kbSegSec(a.seg,'acc',a.id,'seg')}</div>`
       : a.kaynak==="Serbest alandan" ? `<div><label>Serbest alan (m²)</label>
           <input type="number" step="0.01" value="${a.serbest}" oninput="kbSet('acc',${a.id},'serbest',this.value)"></div>`

 calc:function(){
   if(!KB.ilk && $('kb_seg')){
     KB.ilk=true;
     KB.seg.push({id:KB.no++, ad:"Ana kanal", tip:"Dairesel", d:400, a:400, b:250, L:10,
       eps:"Galvanizli sac (standart, ASHRAE ort.)"});
     KB.fit.push({id:KB.no++, ad:"Yerel kayıp 1", seg:KB.seg[0].id, adet:1,
       tip:"90° dirsek (yuvarlak, r/D=1,5)", segB:KB.seg[0].id});
     KB.acc.push({id:KB.no++, ad:"Damper 1", kaynak:"Kanal segmentinden", seg:KB.seg[0].id,
       serbest:0.1, hiz:3, yontem:"ζ katsayısı", tip:"Kelebek damper (tam açık)", zeta:0.3, refDP:30, refV:3});
     kbCiz();
   }
   const Q=V('kb_debi')/3600, t=V('kb_t');
   const rho=kbHavaYog(t), mu=kbViskozite(t), nu=mu/rho;
   put('kb_rho',rho,4); put('kb_mu',mu.toExponential(3));
   const R={}; let sur=0;
   KB.seg.forEach(s=>{
     const g=kbGeo(s);
     const v = g.A>0 ? Q/g.A : 0;
     const re = nu>0 ? v*g.Dh/nu : 0;
     const f = colebrook(re, (KB_EPS[s.eps]||0.09)/1000, g.Dh);
     const dp = g.Dh>0 ? f*(s.L/g.Dh)*(rho*v*v/2) : 0;
     R[s.id]={A:g.A, Dh:g.Dh, v, re, f, dp};
     sur+=dp;
     const el=$('kb_sr'+s.id);
     if(el) el.innerHTML = `<span>Hız <b>${fmt(v,2)} m/s</b></span><span>Dh <b>${fmt(g.Dh*1000,0)} mm</b></span>
       <span>Re <b>${fmt(re,0)}</b> (${re<2300?'laminer':re<4000?'geçiş':'türbülanslı'})</span>
       <span>f <b>${fmt(f,4)}</b></span><span>ΔP <b>${fmt(dp,2)} Pa</b></span>`;
   });
   let yer=0;
   KB.fit.forEach(f=>{
     const s=R[f.seg]; const v=s?s.v:0;
     let zeta=KB_FIT[f.tip], not="";
     if(f.tip==="Ani genişleme (alan oranından)"){
       const b=R[f.segB];
       if(s&&b&&s.A>0&&b.A>0){
         const kucuk=Math.min(s.A,b.A), buyuk=Math.max(s.A,b.A);
         zeta=Math.pow(1-kucuk/buyuk,2);
         not="Borda-Carnot: ζ = (1 − A_küçük ⁄ A_büyük)²";
       } else zeta=0;
     }
     const dp=zeta*rho*v*v/2*f.adet;
     yer+=dp;
     const el=$('kb_fr'+f.id);
     if(el) el.innerHTML = `<span>Hız <b>${fmt(v,2)} m/s</b></span><span>ζ <b>${fmt(zeta,3)}</b></span>
       <span>Adet <b>${fmt(f.adet,0)}</b></span><span>ΔP <b>${fmt(dp,2)} Pa</b></span>
       ${not?`<span style="width:100%">${not}</span>`:''}`;
   });
   let dmp=0;
   KB.acc.forEach(a=>{
     let v;
     if(a.kaynak==="Kanal segmentinden"){ const s=R[a.seg]; v=s?s.v:0; }
     else if(a.kaynak==="Serbest alandan") v = a.serbest>0 ? Q/a.serbest : 0;
     else v=a.hiz;
     let dp, uyari="";
     if(a.yontem==="ζ katsayısı"){ dp=(KB_ACC[a.tip]||0)*rho*v*v/2; }
     else {
       const o = a.refV>0 ? v/a.refV : 0;
       dp = a.refDP*o*o;
       if(o>2.5||o<0.4) uyari='<span style="width:100%;color:var(--warn)">V ⁄ V_ref oranı geniş ekstrapolasyon — katalog aralığını kontrol edin</span>';
     }
     dmp+=dp;
     const el=$('kb_ar'+a.id);
     if(el) el.innerHTML = `<span>Hız <b>${fmt(v,2)} m/s</b></span><span>ΔP <b>${fmt(dp,2)} Pa</b></span>${uyari}`;
   });
   const top=sur+yer+dmp;
   put('kb_sur',sur,1); put('kb_yer',yer,1); put('kb_dmp',dmp,1);
   put('kb_top',top,1); put('kb_mmss',top/9.80665,2);
   const bar=$('kb_bar');
   if(bar) bar.innerHTML = top>0
     ? `<div style="width:${sur/top*100}%;background:var(--accent)"></div>
        <div style="width:${yer/top*100}%;background:var(--warn)"></div>
        <div style="width:${dmp/top*100}%;background:var(--ok)"></div>` : '';
 }});
