          .replace(/ş/g,"s").replace(/ü/g,"u").replace(/â/g,"a"); }
function tdE(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
const TD_SUP=TD_DATA.suppliers, TD_CATS=TD_DATA.cats;
const TD_KAT={}, TD_ARA={};
TD_CATS.forEach((c,i)=>c.sup.forEach(x=>{ if(x.k){ (TD_KAT[x.k]=TD_KAT[x.k]||[]).push(i); } }));
for(const k in TD_SUP){ const s=TD_SUP[k]; TD_ARA[k]=tdN([s.ad,s.unvan,s.malzeme].filter(Boolean).join(" ")); }
const TD_KATARA=TD_CATS.map(c=>tdN(c.ad));
function tdGenislet(q){
  const n=tdN(q).trim(), t=new Set([n]);
  n.split(/[\s,\/]+/).filter(x=>x.length>=3).forEach(x=>{ t.add(x); (TD_ES[x]||[]).forEach(y=>t.add(y)); });
  return {n, terimler:[...t].filter(x=>x.length>=3)};
}
function tdPuan(p){ if(p==null) return "";
  const c = p>=90?"var(--ok)" : p>=70?"var(--warn)" : "#c2413a";
  return `<span class="tdpuan" style="color:${c};border-color:${c}" title="Tedarikçi sicil puanı (FRM-44): ${p}/100">${p}</span>`; }
function tdVade(v){ if(!v) return null; if(/^\d+$/.test(v)) return v+" gün";
  if(v.toUpperCase()==="N") return "N (nakit)"; return v+(/\d/.test(v)?" gün":""); }
function tdTel(t){ if(!t) return `<span class="tdyok">kayıtlı değil</span>`;
  return tdE(t.replace(/\s*\n\s*/g," · ")).replace(/((?:\+90[\s\d]|0)[\d\s\(\)]{9,16}\d)/g,
    m=>`<a href="tel:${m.replace(/[^\d+]/g,"")}">${m}</a>`); }
function tdFirma(key, inline){
  const s = key ? TD_SUP[key] : null;
  const ad = s ? s.ad : inline.n;
  const alt = s ? (s.malzeme || (s.unvan!==s.ad ? s.unvan : "")) : "";
  const not_ = inline && inline.not_ ? ` <small>(${tdE(inline.not_)})</small>` : "";
  let detay="";
  if(s){
    const katlar=(TD_KAT[key]||[]).map(i=>
      `<button class="tdchip${TD_CATS[i].tip==='H'?' hiz':''}" data-tdara="${tdE(TD_CATS[i].ad)}">${tdE(TD_CATS[i].ad)}</button>`).join("");
    detay=`<dl>
      ${s.unvan && s.unvan!==s.ad ? `<dt>Ünvan</dt><dd>${tdE(s.unvan)}</dd>`:""}
      ${s.kod ? `<dt>Cari kodu</dt><dd>${tdE(s.kod)}</dd>`:""}
      <dt>Telefon</dt><dd>${tdTel(s.tel)}</dd>
      <dt>E-posta</dt><dd>${s.email?`<a href="mailto:${tdE(s.email)}">${tdE(s.email)}</a>`:`<span class="tdyok">kayıtlı değil</span>`}</dd>
      <dt>Adres</dt><dd>${s.adres?tdE(s.adres):`<span class="tdyok">kayıtlı değil</span>`}</dd>
      ${s.malzeme?`<dt>Alınan malzeme</dt><dd>${tdE(s.malzeme)}</dd>`:""}
      ${s.vade?`<dt>Vade</dt><dd>${tdE(tdVade(s.vade))}</dd>`:""}
      ${s.puan!=null?`<dt>Sicil puanı</dt><dd>${s.puan} / 100</dd>`:""}
    </dl>${katlar?`<div class="tdchips"><span class="tdyok">Onaylı olduğu kalemler:</span>${katlar}</div>`:""}`;
  } else {
    detay=`<dl><dt>Telefon</dt><dd>${tdTel(inline.t)}</dd>
      <dt>E-posta</dt><dd>${inline.e?`<a href="mailto:${tdE(inline.e)}">${tdE(inline.e)}</a>`:`<span class="tdyok">kayıtlı değil</span>`}</dd>
      <dd style="grid-column:1/-1" class="tdyok">Bu firma onaylı listede var; sicil formunda ayrıntılı kaydı yok.</dd></dl>`;
  }
  const vade = s && s.vade ? `<span class="tdroz">${tdE(tdVade(s.vade))}</span>` : "";
  return `<div class="tdfirma"><button class="tdsatir"><span class="tdok">▸</span>
    <span class="tdad">${tdE(ad)}${not_}${alt?`<small>${tdE(alt)}</small>`:""}</span>${vade}${tdPuan(s?s.puan:null)}</button>
    <div class="tddetay">${detay}</div></div>`;
}
function tdKat(i){ const c=TD_CATS[i];
  return `<div class="tdkat${c.tip==='H'?' hiz':''}"><h4>${tdE(c.ad)}${c.tip==="H"?'<span class="tdtip">Hizmet</span>':''}</h4>
    ${c.sup.map(x=>tdFirma(x.k||null,x)).join("")}</div>`; }
function tdTumKategoriler(){
  const m=TD_CATS.map(c=>c.tip==="M"?`<button class="tdchip" data-tdara="${tdE(c.ad)}">${tdE(c.ad)}</button>`:"").join("");
  const h=TD_CATS.map(c=>c.tip==="H"?`<button class="tdchip hiz" data-tdara="${tdE(c.ad)}">${tdE(c.ad)}</button>`:"").join("");
  return `<div class="tdgrup">Malzemeler</div><div class="tdchips">${m}</div>
          <div class="tdgrup">Hizmetler</div><div class="tdchips">${h}</div>`; }
function tdAra(q){
  const el=$('td_sonuc'); if(!el) return;
  const {n,terimler}=tdGenislet(q);
  if(!n){ el.innerHTML=tdTumKategoriler(); return; }
  const katPuan=[];
  TD_KATARA.forEach((hay,i)=>{ let p=0;
    if(hay.includes(n)) p=3; else for(const t of terimler){ if(hay.includes(t)) p=Math.max(p,2); }
    if(p) katPuan.push([p,i]); });
  katPuan.sort((a,b)=>b[0]-a[0]);
  const gost=new Set(); katPuan.forEach(([,i])=>TD_CATS[i].sup.forEach(x=>{ if(x.k) gost.add(x.k); }));
  const malz=[], adlar=[];
  for(const k in TD_SUP){
    if(gost.has(k)) continue;
    const s=TD_SUP[k], mz=tdN(s.malzeme||""), ad=tdN((s.ad||"")+" "+(s.unvan||""));
    let hit=false;
    for(const t of terimler){ if(mz && mz.includes(t)){ malz.push(k); hit=true; break; } }
    if(!hit) for(const t of terimler){ if(ad.includes(t)){ adlar.push(k); break; } }
  }
  let html="";
  if(katPuan.length) html+=`<div class="tdbaslik">Onaylı tedarikçi listesindeki kalemler (FRM-43)</div>`
    + katPuan.map(([,i])=>tdKat(i)).join("");
  if(malz.length) html+=`<div class="tdbaslik">Bu malzemede daha önce alım yapılan firmalar</div>
    <div class="tdkat nötr">`+malz.map(k=>tdFirma(k)).join("")+`</div>`;
  if(adlar.length) html+=`<div class="tdbaslik">Adı eşleşen firmalar</div>
    <div class="tdkat nötr">`+adlar.map(k=>tdFirma(k)).join("")+`</div>`;
  if(!html) html=`<div class="note w"><b>"${tdE(q)}"</b> için kayıt bulunamadı. Farklı bir kelime deneyin
    (örn. malzemenin genel adı) ya da aşağıdaki kalemlere göz atın.</div>`+tdTumKategoriler();
  el.innerHTML=html;
}
function tdTumFirmalar(){
  const el=$('td_liste'); if(!el) return;
  const sirali=Object.keys(TD_SUP).sort((a,b)=>TD_SUP[a].ad.localeCompare(TD_SUP[b].ad,"tr"));
  let harf="", html="";
  sirali.forEach(k=>{ const i=TD_SUP[k].ad.charAt(0).toLocaleUpperCase("tr");
    if(i!==harf){ harf=i; html+=`<div class="tdharf">${harf}</div>`; }
    html+=tdFirma(k); });
  el.innerHTML=html;
}
function tdListeAc(){
  const el=$('td_liste'); if(!el) return;
  const ac = el.hasAttribute('hidden');
  if(ac){ el.removeAttribute('hidden'); if(!el.innerHTML) tdTumFirmalar(); } else el.setAttribute('hidden','');
  $('td_listeBtn').textContent = (ac?"Firma listesini gizle":"Tüm firmaları listele")+" ("+Object.keys(TD_SUP).length+")";
}

/* ============================ ÇALIŞTIRMA ============================ */
function calcAll(){ MOD.forEach(m=>{ try{ m.calc(); }catch(e){ console.warn(m.id,e); } }); }
function notlarToggle(){
  const a=document.body.classList.toggle('notlar-acik');
  const b=$('btnNot'); if(b) b.classList.toggle('on',a);
}
function kartlarToggle(){
  const sec=MOD.find(m=>$('sec_'+m.id) && $('sec_'+m.id).classList.contains('on'));
  if(!sec) return;
  const kartlar=$('sec_'+sec.id).querySelectorAll('.card');
  const hepsiAcik=[...kartlar].every(c=>!c.classList.contains('kapali'));
  kartlar.forEach(c=>c.classList.toggle('kapali',hepsiAcik));
}
function binaTipiDegisti(){
  const ti = BOYLER_TIP.indexOf(S('by_tip'));
  const es = ti===1 ? inter(V('by_daire'),APT_DAIRE,APT_FAKTOR) : BOYLER_ESZAMAN[ti];
  if($('by_es'))  $('by_es').value  = Math.round(es*1000)/1000;
  if($('by_dep')) $('by_dep').value = BOYLER_DEPO[ti];
  calcAll();
}
var AKTIF_GRUP = null;
function grupList(){ const g=[]; MOD.forEach(m=>{ if(!g.includes(m.grup)) g.push(m.grup); }); return g; }
function grupCiz(){
  $('navMods').innerHTML = MOD.filter(m=>m.grup===AKTIF_GRUP)
    .map(m=>`<button id="nav_${m.id}" onclick="goto('${m.id}')">${m.ad}</button>`).join('');
}
function gotoGrup(g, hedef){
  AKTIF_GRUP = g;
  document.querySelectorAll('#navGrp button').forEach(b=>{
    const on=b.dataset.g===g; b.classList.toggle('on', on);
    if(on && b.scrollIntoView) b.scrollIntoView({block:'nearest',inline:'nearest'});
  });
  grupCiz();
  const ilk = (hedef && MOD.find(m=>m.id===hedef)) || MOD.find(m=>m.grup===g);
  if(ilk) goto(ilk.id);
}
function goto(id){
  const m0 = MOD.find(m=>m.id===id); if(!m0) return;
  if(m0.grup!==AKTIF_GRUP){ gotoGrup(m0.grup, id); return; }
  MOD.forEach(m=>{ const s=$('sec_'+m.id); if(s) s.classList.toggle('on', m.id===id);
                   const n=$('nav_'+m.id); if(n){ n.classList.toggle('on', m.id===id);
                     if(m.id===id && n.scrollIntoView) n.scrollIntoView({block:'nearest',inline:'nearest'}); } });
  window.scrollTo({top:0,behavior:'smooth'});
}
(function init(){
  $('nav').innerHTML = `<div class="grp" id="navGrp">${grupList().map(g=>
      `<button data-g="${g}" onclick="gotoGrup('${g}')">${g}</button>`).join('')}</div>
    <div class="mods" id="navMods"></div>`;
  $('main').innerHTML = MOD.map(m=>`<section id="sec_${m.id}"><h2>${m.baslik}</h2>
     <p class="lead">${m.lead}</p>${m.html}</section>`).join('');
  const KAPALI_BASLAT=["Yönetmelik","Manuel Hesaplama","Katsayıları","Tavsiye Hava","Kataloğu",
    "Gövde Ölçüleri","Tipi Tablosu","Filtresi Tablosu","Santral Tablosu","Açınım Tablosu",
    "Faktörü ve Kalıp","Kolektör Tipleri","Hücre Gabarisi","Yük Değerleri","K Duyarlılığı",
    "Atık Su Tesisatı","Kelepçeler","Kauçuk İzolasyon","Vitrifiye İç Takım","Vitrifiye Montajı",
    "Duş Kanalı","PP-R (PN20)","PE 100","Bakır","REHAU RAUTITAN","Boru Tesisat"];
  document.querySelectorAll('.card').forEach(c=>{
    const h=c.querySelector(':scope > h3'); if(!h) return;
    const body=document.createElement('div'); body.className='cardbody';
    while(h.nextSibling) body.appendChild(h.nextSibling);
    c.appendChild(body);
    if(KAPALI_BASLAT.some(k=>h.textContent.includes(k))) c.classList.add('kapali');
  });
  MOD.forEach(m=>{ const sec=$('sec_'+m.id); if(!sec) return;
    sec.querySelectorAll('.card').forEach((c,i)=>c.style.setProperty('--i', Math.min(i,9))); });
  document.addEventListener('pointermove', e=>{
    const c=e.target.closest && e.target.closest('.card'); if(!c) return;
    const r=c.getBoundingClientRect();
    c.style.setProperty('--mx',(e.clientX-r.left)+'px');
    c.style.setProperty('--my',(e.clientY-r.top)+'px');
  }, {passive:true});
  setTimeout(()=>{ const lb=$('loadbeam'); if(lb) lb.remove(); }, 3200);
  const kapatSplash=()=>{ const sp=$('splash'); if(sp) sp.remove(); };
  setTimeout(kapatSplash, 2450);
  ['pointerdown','keydown','wheel'].forEach(ev=>
    window.addEventListener(ev, kapatSplash, {once:true, passive:true}));
  document.addEventListener('click', e=>{
    const h=e.target.closest('.card > h3');
    if(h){ h.parentElement.classList.toggle('kapali'); return; }
    const n=e.target.closest('.note');
    if(n && !n.classList.contains('w')) n.classList.toggle('acik');
  });
  binaTipiDegisti();
  gotoGrup(MOD[0].grup);
  calcAll();
})();

/* ---- Kaydet / Yükle ---- */
function alanlar(){ return Array.from(document.querySelectorAll('input,select')).filter(e=>e.id && e.type!=='file'); }
function saveJSON(){
  const d={}; alanlar().forEach(e=>d[e.id]=e.value);
  const blob=new Blob([JSON.stringify({tip:"mekanik-tesisat-hesap",tarih:new Date().toISOString(),veri:d},null,1)],
    {type:"application/json"});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download="tesisat-hesap-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function loadJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); const d=j.veri||j;
      Object.keys(d).forEach(k=>{ const e=$(k); if(e) e.value=d[k]; });
      calcAll();
    }catch(e){ alert("Dosya okunamadı: "+e.message); } };
  r.readAsText(f); inp.value="";
}
